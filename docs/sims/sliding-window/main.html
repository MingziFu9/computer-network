<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滑动窗口与拥塞控制</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.tabs button { border-radius:6px 6px 0 0; }
.segs { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; position:relative; }
.seg { width:38px; height:38px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:monospace; font-weight:bold; border:2px solid var(--line); background:#fafafa; position:relative; }
.seg.acked { background:#c8e6c9; border-color:#43a047; }
.seg.fly { background:#fff3e0; border-color:#ef6c00; }
.seg.lost { background:#ffcdd2; border-color:#e53935; }
.seg.got { background:#e3f2fd; border-color:#1e88e5; }
.seg.win { box-shadow:0 0 0 3px #3f51b5 inset; }
.legend span { display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:middle; margin:0 3px 0 10px; border:2px solid; }
#chart { width:100%; height:auto; display:block; }
.hide { display:none; }
</style>
</head>
<body>
<h1>滑动窗口与拥塞控制</h1>
<div class="row tabs"><button id="tab1" class="on">滑动窗口</button><button id="tab2">拥塞控制</button></div>

<div id="p1">
  <div class="sub">发送方要发 12 个报文段。窗口内的报文段可以连续发出，不必一个一个等确认；收到确认后窗口向右滑动。接收方采用累积确认：确认号表示“下一个希望收到的编号”。</div>
  <div class="row">窗口大小 <input type="range" id="w" min="1" max="6" value="4" style="max-width:160px"> <b id="wv">4</b>
    <label style="font-size:13px"><input type="checkbox" id="lose"> 下一个发出的报文段在途中丢失</label></div>
  <div class="row"><button id="s1">发送一个</button><button id="sall" class="main">发满窗口</button><button id="arr">数据到达，接收方确认</button><button id="rto">超时重传</button><button id="r1">重来</button></div>
  <div class="box">
    <h2>发送方</h2><div class="segs" id="snd"></div>
    <div class="legend note"><span style="background:#c8e6c9;border-color:#43a047"></span>已确认<span style="background:#fff3e0;border-color:#ef6c00"></span>已发送、等确认<span style="background:#ffcdd2;border-color:#e53935"></span>在途中丢失<span style="background:#fafafa;border-color:#cfd8dc"></span>还没发　蓝框 = 发送窗口</div>
    <h2 style="margin-top:8px">接收方</h2><div class="segs" id="rcv"></div>
    <div class="legend note"><span style="background:#e3f2fd;border-color:#1e88e5"></span>已收到</div>
    <div class="msg" id="m1"></div>
  </div>
</div>

<div id="p2" class="hide">
  <div class="sub">每点一次“下一轮”，发送方按当前拥塞窗口发完一轮并收到确认。拥塞窗口小于门限时慢开始（翻倍，但不超过门限），达到门限后拥塞避免（每轮加 1）。单位：报文段。</div>
  <div class="row">初始门限 ssthresh <select id="th0"><option>8</option><option>12</option><option selected>16</option><option>24</option></select>
    <button id="nx" class="main">下一轮</button><button id="to">超时</button><button id="dup">3 个重复确认</button><button id="demo">按例题演示</button><button id="r2">重来</button></div>
  <div class="box"><svg id="chart" viewBox="0 0 640 300"></svg>
    <div class="msg" id="m2"></div>
    <div class="note" id="hist" style="font-family:monospace"></div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  // ---------- 标签页 ----------
  function tab(i) { $("p1").classList.toggle("hide", i !== 1); $("p2").classList.toggle("hide", i !== 2); $("tab1").classList.toggle("on", i === 1); $("tab2").classList.toggle("on", i === 2); }
  $("tab1").onclick = function () { tab(1); }; $("tab2").onclick = function () { tab(2); };

  // ---------- 滑动窗口 ----------
  var N = 12, st, got, base, nxt;
  function reset1() { st = []; got = []; for (var i = 1; i <= N; i++) { st[i] = 0; got[i] = false; } base = 1; nxt = 1; $("m1").textContent = "点“发满窗口”，把窗口里的报文段连续发出去。"; draw1(); }
  function W() { return +$("w").value; }
  function draw1() {
    var s = "", r = "";
    for (var i = 1; i <= N; i++) {
      var c = st[i] === 2 ? "acked" : st[i] === 1 ? "fly" : st[i] === 3 ? "lost" : "";
      if (i >= base && i < base + W()) c += " win";
      s += '<div class="seg ' + c + '">' + i + "</div>";
      r += '<div class="seg ' + (got[i] ? "got" : "") + '">' + i + "</div>";
    }
    $("snd").innerHTML = s; $("rcv").innerHTML = r; $("wv").textContent = W();
    var hasFly = false; for (var j = 1; j <= N; j++) if (st[j] === 1 && !got[j]) hasFly = true;
    $("s1").disabled = $("sall").disabled = !(nxt <= N && nxt < base + W());
    $("arr").disabled = !hasFly; $("rto").disabled = !(base <= N && (st[base] === 3 || st[base] === 1) && !got[base]);
  }
  function sendOne() {
    if (nxt > N || nxt >= base + W()) return false;
    if ($("lose").checked) { st[nxt] = 3; $("lose").checked = false; } else st[nxt] = 1;
    nxt++; return true;
  }
  $("s1").onclick = function () { var a = nxt; if (sendOne()) $("m1").textContent = "发出报文段 " + a + (st[a] === 3 ? "（它将在途中丢失）" : "") + "。"; draw1(); };
  $("sall").onclick = function () { var a = nxt; while (sendOne()); $("m1").textContent = "连续发出报文段 " + a + "～" + (nxt - 1) + "，不必等确认。发送窗口内的报文段都发完了，现在只能等确认。"; draw1(); };
  $("arr").onclick = function () {
    var arrived = [], lost = [];
    for (var i = 1; i <= N; i++) { if (st[i] === 1 && !got[i]) { got[i] = true; arrived.push(i); } else if (st[i] === 3) lost.push(i); }
    var ack = 1; while (ack <= N && got[ack]) ack++;
    var old = base;
    for (var j = 1; j < ack; j++) st[j] = 2;
    // 已到达但还没被累积确认的报文段，在发送方看来仍是“已发送、等确认”
    base = ack;
    var msg = (arrived.length ? "接收方收到 " + arrived.join("、") + "。" : "");
    if (lost.length) {
      msg += "报文段 " + lost.join("、") + " 丢了。";
      if (base === old) msg += "接收方只能一直回复确认号 " + ack + "（重复确认），表示“我还在等 " + ack + "”。窗口无法向右滑动，后面收到的先存在接收缓存里。等计时器超时，点“超时重传”。";
      else msg += "确认号 " + ack + "：前 " + (ack - 1) + " 个都收到了，窗口滑动到从 " + ack + " 开始；" + ack + " 号还没到，接收方在等它。";
    } else if (ack > N) msg += "确认号 " + ack + "：全部 12 个都收到了，传输完成！";
    else msg += "确认号 " + ack + "，窗口向右滑动 " + (base - old) + " 格，新进入窗口的报文段可以发送了。";
    $("m1").textContent = msg; draw1();
  };
  $("rto").onclick = function () {
    var b = base; st[b] = 1;
    $("m1").textContent = "发送方迟迟没收到报文段 " + b + " 的确认，计时器超时，重新发送报文段 " + b + "。再点“数据到达，接收方确认”。";
    draw1();
  };
  $("w").oninput = draw1; $("r1").onclick = reset1;
  reset1();

  // ---------- 拥塞控制 ----------
  var rounds, ev;   // rounds[i] = {c: 拥塞窗口, t: 本轮门限}
  function reset2() { var t = +$("th0").value; rounds = [{ c: 1, t: t }]; ev = []; $("m2").textContent = "第 1 轮拥塞窗口为 1，慢开始。点“下一轮”。"; draw2(); }
  function last() { return rounds[rounds.length - 1]; }
  function next() {
    var L = last(), c, msg;
    if (L.c < L.t) { c = Math.min(L.c * 2, L.t); msg = "慢开始：" + L.c + " × 2 = " + L.c * 2 + (L.c * 2 > L.t ? "，超过门限 " + L.t + "，只增长到门限 " + c : "") + "。"; }
    else { c = L.c + 1; msg = "拥塞避免：已达到门限，每轮只加 1，" + L.c + " + 1 = " + c + "。"; }
    rounds.push({ c: c, t: L.t }); return msg;
  }
  function half(c) { return Math.max(2, Math.floor(c / 2)); }
  $("nx").onclick = function () { if (rounds.length >= 30) return; $("m2").textContent = "第 " + (rounds.length + 1) + " 轮　" + next(); draw2(); };
  $("to").onclick = function () {
    if (rounds.length >= 30) return; var L = last(), t = half(L.c);
    ev.push({ r: rounds.length, k: "超时" }); rounds.push({ c: 1, t: t });
    $("m2").textContent = "第 " + rounds.length + " 轮　第 " + (rounds.length - 1) + " 轮发生超时：门限 = " + L.c + " ÷ 2 = " + t + "，拥塞窗口重置为 1，重新慢开始。"; draw2();
  };
  $("dup").onclick = function () {
    if (rounds.length >= 30) return; var L = last(), t = half(L.c);
    ev.push({ r: rounds.length, k: "3 个重复确认" }); rounds.push({ c: t, t: t });
    $("m2").textContent = "第 " + rounds.length + " 轮　第 " + (rounds.length - 1) + " 轮收到 3 个重复确认：快重传丢失的报文段；快恢复：门限 = " + L.c + " ÷ 2 = " + t + "，拥塞窗口直接设为 " + t + "，进入拥塞避免。"; draw2();
  };
  $("demo").onclick = function () {
    $("th0").value = "16"; reset2();
    var i; for (i = 0; i < 8; i++) next();
    var t = half(last().c); ev.push({ r: rounds.length, k: "超时" }); rounds.push({ c: 1, t: t });
    for (i = 0; i < 6; i++) next();
    t = half(last().c); ev.push({ r: rounds.length, k: "3 个重复确认" }); rounds.push({ c: t, t: t });
    next(); next();
    $("m2").textContent = "9.6.2 例题：初始门限 16，第 9 轮后超时，第 16 轮（拥塞窗口 12）后收到 3 个重复确认。对照下面每一轮的数值核对答案。"; draw2();
  };
  $("r2").onclick = reset2; $("th0").onchange = reset2;
  function draw2() {
    var X0 = 40, Y0 = 265, Wd = 585, Ht = 240, nR = Math.max(20, rounds.length);
    var maxC = 4; rounds.forEach(function (r) { maxC = Math.max(maxC, r.c, r.t); }); maxC = Math.ceil((maxC + 2) / 4) * 4;
    function x(i) { return X0 + (i + 0.5) * Wd / nR; } function y(v) { return Y0 - v * Ht / maxC; }
    var s = '<line x1="' + X0 + '" y1="' + Y0 + '" x2="' + (X0 + Wd) + '" y2="' + Y0 + '" stroke="#90a4ae"/><line x1="' + X0 + '" y1="' + Y0 + '" x2="' + X0 + '" y2="' + (Y0 - Ht) + '" stroke="#90a4ae"/>';
    for (var v = 0; v <= maxC; v += maxC / 4) s += '<text x="' + (X0 - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#78909c">' + v + '</text><line x1="' + X0 + '" y1="' + y(v) + '" x2="' + (X0 + Wd) + '" y2="' + y(v) + '" stroke="#eceff1"/>';
    for (var i = 0; i < nR; i++) if ((i + 1) % (nR > 20 ? 2 : 1) === 0 || i === 0) s += '<text x="' + x(i) + '" y="' + (Y0 + 14) + '" text-anchor="middle" font-size="10" fill="#78909c">' + (i + 1) + "</text>";
    s += '<text x="' + (X0 + Wd) + '" y="' + (Y0 + 28) + '" text-anchor="end" font-size="11" fill="#78909c">轮次</text><text x="' + X0 + '" y="14" font-size="11" fill="#78909c">拥塞窗口</text>';
    // 门限阶梯线
    var tp = ""; rounds.forEach(function (r, i) { tp += (i ? "L" : "M") + (x(i) - Wd / nR / 2) + "," + y(r.t) + "L" + (x(i) + Wd / nR / 2) + "," + y(r.t); });
    s += '<path d="' + tp + '" fill="none" stroke="#e53935" stroke-dasharray="5 4" stroke-width="1.5"/>';
    s += '<text x="' + (x(rounds.length - 1) + Wd / nR / 2 + 2) + '" y="' + (y(last().t) - 4) + '" font-size="11" fill="#e53935">门限 ' + last().t + "</text>";
    ev.forEach(function (e) { s += '<line x1="' + (x(e.r - 1) + Wd / nR / 2) + '" y1="' + Y0 + '" x2="' + (x(e.r - 1) + Wd / nR / 2) + '" y2="' + (Y0 - Ht) + '" stroke="#ef6c00" stroke-dasharray="2 3"/><text x="' + (x(e.r - 1) + Wd / nR / 2 + 3) + '" y="' + (Y0 - Ht + 12) + '" font-size="11" fill="#ef6c00">' + e.k + "</text>"; });
    var p = ""; rounds.forEach(function (r, i) { p += (i ? "L" : "M") + x(i) + "," + y(r.c); });
    s += '<path d="' + p + '" fill="none" stroke="#3f51b5" stroke-width="2"/>';
    rounds.forEach(function (r, i) {
      var ss = r.c < r.t; s += '<circle cx="' + x(i) + '" cy="' + y(r.c) + '" r="4" fill="' + (ss ? "#3f51b5" : "#43a047") + '"/>';
      s += '<text x="' + x(i) + '" y="' + (y(r.c) - 8) + '" text-anchor="middle" font-size="10.5" fill="#263238">' + r.c + "</text>";
    });
    s += '<circle cx="' + (X0 + 330) + '" cy="10" r="4" fill="#3f51b5"/><text x="' + (X0 + 338) + '" y="14" font-size="11">慢开始</text><circle cx="' + (X0 + 395) + '" cy="10" r="4" fill="#43a047"/><text x="' + (X0 + 403) + '" y="14" font-size="11">拥塞避免</text><line x1="' + (X0 + 470) + '" y1="10" x2="' + (X0 + 490) + '" y2="10" stroke="#e53935" stroke-dasharray="5 4"/><text x="' + (X0 + 494) + '" y="14" font-size="11">门限</text>';
    $("chart").innerHTML = s;
    $("hist").textContent = "各轮拥塞窗口：" + rounds.map(function (r) { return r.c; }).join(", ");
    var full = rounds.length >= 30; $("nx").disabled = $("to").disabled = $("dup").disabled = full;
  }
  reset2();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
