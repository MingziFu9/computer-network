<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T568B 线序</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.tray, .plug { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
.wire { width:58px; height:64px; border:2px solid #ccc; border-radius:6px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; font-size:12px; background:#fff; padding-bottom:3px; }
.wire .c { width:16px; height:40px; border-radius:3px; margin-bottom:3px; border:1px solid #999; }
.wire.used { opacity:.25; cursor:default; }
.pin { width:58px; height:86px; border:2px dashed #bbb; border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; font-size:12px; padding:3px 0; cursor:pointer; background:#fafafa; }
.pin.ok { border:2px solid var(--pos); background:#e8f5e9; }
.pin.bad { border:2px solid var(--neg); background:#ffebee; }
.pin .c { width:16px; height:46px; border-radius:3px; border:1px solid #999; }
.mode button.on { background:var(--accent); color:#fff; }
</style>
</head>
<body>
<h1>排线序：把 8 根线排进水晶头</h1>
<div class="sub">水晶头金属片朝上、卡扣朝下，从左到右是 1～8 号引脚。点下面的线，它会排进下一个空引脚；点已排好的引脚可以把线取回来。</div>
<div class="row mode"><span>标准：</span><button data-s="B">T568B（常用）</button><button data-s="A">T568A</button>
  <button id="chk">检查</button><button id="clr">清空重来</button><button id="ans">看答案</button></div>
<div class="box"><h2>水晶头引脚（1 → 8）</h2><div class="plug" id="plug"></div></div>
<div class="box"><h2>待排的线（顺序已打乱）</h2><div class="tray" id="tray"></div></div>
<div class="box"><div class="msg" id="msg"></div><div class="note">口诀：T568B 是“白橙橙，白绿蓝，白蓝绿，白棕棕”；注意第 3 根是白绿，第 6 根才是绿。T568A 就是把 B 里的橙对和绿对互换（1↔3、2↔6）。</div></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var COL = { "橙": "#f57c00", "绿": "#2e7d32", "蓝": "#1565c0", "棕": "#6d4c41" };
  function css(name) { // “白橙”画成白底橙条纹
    var base = name.replace("白", "");
    return name.charAt(0) === "白" ? "repeating-linear-gradient(0deg,#fff 0 6px," + COL[base] + " 6px 10px)" : COL[base];
  }
  var STD = { B: ["白橙", "橙", "白绿", "蓝", "白蓝", "绿", "白棕", "棕"], A: ["白绿", "绿", "白橙", "蓝", "白蓝", "橙", "白棕", "棕"] };
  var shuffled = ["蓝", "白棕", "橙", "白绿", "棕", "白蓝", "绿", "白橙"];
  var std = "B", pins = [], tries = 0;
  function render(check) {
    var right = 0;
    $("plug").innerHTML = "";
    for (var i = 0; i < 8; i++) {
      var d = document.createElement("div"), w = pins[i];
      d.className = "pin" + (check && w ? (w === STD[std][i] ? " ok" : " bad") : "");
      if (w && w === STD[std][i]) right++;
      d.innerHTML = "<span>" + (i + 1) + "</span>" + (w ? '<span class="c" style="background:' + css(w) + '"></span><span>' + w + "</span>" : "<span></span><span>空</span>");
      (function (k) { d.onclick = function () { pins[k] = null; render(); }; })(i);
      $("plug").appendChild(d);
    }
    $("tray").innerHTML = "";
    shuffled.forEach(function (w) {
      var used = pins.indexOf(w) >= 0, d = document.createElement("div");
      d.className = "wire" + (used ? " used" : "");
      d.innerHTML = '<span class="c" style="background:' + css(w) + '"></span>' + w;
      d.onclick = function () { if (used) return; for (var k = 0; k < 8; k++) if (!pins[k]) { pins[k] = w; break; } render(); };
      $("tray").appendChild(d);
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-s]"), function (b) { b.className = b.dataset.s === std ? "on" : ""; });
    return right;
  }
  $("chk").onclick = function () {
    var filled = pins.filter(Boolean).length; tries++;
    var right = render(true);
    if (filled < 8) $("msg").innerHTML = "还有 " + (8 - filled) + " 个引脚是空的，排满再检查。";
    else if (right === 8) $("msg").innerHTML = '<span class="ok">全对！</span>这是 T568' + std + " 线序。" + (std === "B" ? "试着切换到 T568A 再排一次，看哪几根线换了位置。" : "对比 T568B：1、2 号和 3、6 号交换了，也就是橙对和绿对互换。");
    else $("msg").innerHTML = '<span class="bad">对了 ' + right + " 根。</span>红框的引脚放错了，点它把线取回来重新排。";
  };
  $("clr").onclick = function () { pins = []; $("msg").textContent = ""; render(); };
  $("ans").onclick = function () { pins = STD[std].slice(); render(true); $("msg").innerHTML = "这是 T568" + std + " 的标准线序。两端都用同一种标准就是直通线，一端 A 一端 B 就是交叉线。"; };
  Array.prototype.forEach.call(document.querySelectorAll("[data-s]"), function (b) { b.onclick = function () { std = b.dataset.s; pins = []; $("msg").textContent = "已切换到 T568" + std + "，请重新排线。"; render(); }; });
  render();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
