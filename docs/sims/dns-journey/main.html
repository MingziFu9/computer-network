<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNS 查询之旅</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
#map { width:100%; height:auto; display:block; }
ol#log { margin:4px 0 0; padding-left:22px; font-size:13px; }
ol#log li.cur { font-weight:bold; color:var(--accent); }
.cache { font-family:monospace; font-size:12.5px; background:#f5f5f5; border-radius:6px; padding:4px 8px; min-height:1.6em; }
</style>
</head>
<body>
<h1>DNS 查询之旅：查一个域名要问几台服务器？</h1>
<div class="sub">小林的电脑要查询域名对应的 IP 地址。选择查询方式，点“下一步”看每个报文在谁和谁之间传送。各服务器的回答为教学示意。</div>
<div class="row">查询 <select id="dom"><option>www.xiaohe.com</option><option>mail.xiaohe.com</option></select>
  方式 <select id="mode"><option value="it">主机递归 + 服务器之间迭代（常见）</option><option value="re">全部递归（对比用）</option></select></div>
<div class="row"><button id="go" class="main">开始查询</button><button id="next">下一步</button><button id="all">全部显示</button><button id="clr">清空缓存</button></div>
<div class="grid2">
  <div class="box"><svg id="map" viewBox="0 0 420 330"></svg></div>
  <div class="box"><h2>查询过程</h2><ol id="log"></ol>
    <div class="msg" id="msg"></div>
    <h2 style="margin-top:8px">本地域名服务器的缓存</h2><div class="cache" id="cache"></div>
  </div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var N = {
    pc:   { x: 75,  y: 270, t: "小林的电脑", s: "192.168.8.11" },
    loc:  { x: 75,  y: 120, t: "本地域名服务器", s: "替主机跑腿" },
    root: { x: 300, y: 40,  t: "根域名服务器", s: "知道各顶级域名服务器" },
    com:  { x: 335, y: 160, t: ".com 顶级域名服务器", s: "知道 xiaohe.com 的权威服务器" },
    auth: { x: 300, y: 280, t: "xiaohe.com 权威服务器", s: "保存 www、mail 的地址" }
  };
  var cacheHost = {}, cacheNS = false, steps = [], k = 0;
  function msg(a, b, txt, kind) { return { a: a, b: b, txt: txt, kind: kind }; }   // kind: q 询问 / r 指路 / ans 答案
  function plan() {
    var d = $("dom").value, ip = "192.168.8.130", S = [];
    S.push(msg("pc", "loc", "电脑问本地域名服务器：" + d + " 的地址是多少？（递归查询：请给我最终答案）", "q"));
    if (cacheHost[d]) {
      S.push(msg("loc", "pc", "缓存里就有！直接回答：" + d + " = " + ip + "。一步完成，不用问别人。", "ans"));
      return S;
    }
    if (cacheNS) {
      S.push(msg("loc", "auth", "缓存里记得 xiaohe.com 的权威服务器在哪，跳过根和 .com，直接问它。", "q"));
      S.push(msg("auth", "loc", "权威服务器回答：" + d + " = " + ip + "。", "ans"));
      S.push(msg("loc", "pc", "本地域名服务器把答案告诉电脑，并记入缓存。", "ans"));
      return S;
    }
    if ($("mode").value === "it") {
      S.push(msg("loc", "root", "本地域名服务器问根：" + d + " 的地址？（迭代查询）", "q"));
      S.push(msg("root", "loc", "根：我不知道，但 .com 归 .com 顶级域名服务器管，你去问它。", "r"));
      S.push(msg("loc", "com", "本地域名服务器问 .com 服务器：" + d + " 的地址？", "q"));
      S.push(msg("com", "loc", ".com 服务器：我不知道，xiaohe.com 有自己的权威服务器，你去问它。", "r"));
      S.push(msg("loc", "auth", "本地域名服务器问 xiaohe.com 权威服务器：" + d + " 的地址？", "q"));
      S.push(msg("auth", "loc", "权威服务器：" + d + " = " + ip + "。这是最终答案。", "ans"));
      S.push(msg("loc", "pc", "本地域名服务器把答案告诉电脑，并把结果和权威服务器的位置记入缓存。", "ans"));
    } else {
      S.push(msg("loc", "root", "本地域名服务器请根替它查到底（递归）。", "q"));
      S.push(msg("root", "com", "根不知道，只好自己去问 .com 服务器，并要求它查到底。", "q"));
      S.push(msg("com", "auth", ".com 服务器也不知道，再去问 xiaohe.com 权威服务器。", "q"));
      S.push(msg("auth", "com", "权威服务器：" + d + " = " + ip + "。", "ans"));
      S.push(msg("com", "root", ".com 服务器把答案交回根。", "ans"));
      S.push(msg("root", "loc", "根把答案交回本地域名服务器。全世界的查询都这样经过根，根会不堪重负，所以实际上根不做递归。", "ans"));
      S.push(msg("loc", "pc", "本地域名服务器把答案告诉电脑，并记入缓存。", "ans"));
    }
    return S;
  }
  function node(id, n, hot) {
    return '<rect x="' + (n.x - 62) + '" y="' + (n.y - 20) + '" width="124" height="40" rx="8" fill="' + (hot ? "#e8eaf6" : "#fff") + '" stroke="' + (hot ? "#3f51b5" : "#90a4ae") + '" stroke-width="' + (hot ? 2.5 : 1.5) + '"/>' +
      '<text x="' + n.x + '" y="' + (n.y - 3) + '" text-anchor="middle" font-size="11.5" font-weight="bold">' + n.t + '</text>' +
      '<text x="' + n.x + '" y="' + (n.y + 12) + '" text-anchor="middle" font-size="9.5" fill="#78909c">' + n.s + "</text>";
  }
  function draw() {
    var s = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>';
    var hot = {};
    if (k > 0) { hot[steps[k - 1].a] = 1; hot[steps[k - 1].b] = 1; }
    var cnt = {};
    for (var i = 0; i < k; i++) {
      var m = steps[i], A = N[m.a], B = N[m.b], key = [m.a, m.b].sort().join();
      cnt[key] = (cnt[key] || 0) + 1;
      var P = N[key.split(",")[0]], Q = N[key.split(",")[1]];   // 按固定方向算垂线，往返两条线分到两侧
      var cx = Q.x - P.x, cy = Q.y - P.y, CL = Math.sqrt(cx * cx + cy * cy), off = (m.a < m.b ? 1 : -1) * 7, px = -cy / CL * off, py = cx / CL * off;
      var dx = B.x - A.x, dy = B.y - A.y, L = Math.sqrt(dx * dx + dy * dy), ux = dx / L, uy = dy / L;
      var x1 = A.x + ux * 40 + px, y1 = A.y + uy * 26 + py, x2 = B.x - ux * 40 + px, y2 = B.y - uy * 26 + py;
      var col = m.kind === "q" ? "#3f51b5" : m.kind === "r" ? "#ef6c00" : "#43a047", cur = i === k - 1;
      s += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + col + '" stroke-width="' + (cur ? 3 : 1.5) + '" opacity="' + (cur ? 1 : 0.55) + '" marker-end="url(#ah)"/>';
      s += '<circle cx="' + ((x1 + x2) / 2 + px * 1.6) + '" cy="' + ((y1 + y2) / 2 + py * 1.6) + '" r="8" fill="' + col + '"/><text x="' + ((x1 + x2) / 2 + px * 1.6) + '" y="' + ((y1 + y2) / 2 + py * 1.6 + 3.5) + '" text-anchor="middle" font-size="10" fill="#fff">' + (i + 1) + "</text>";
    }
    for (var id in N) s += node(id, N[id], hot[id]);
    s += '<text x="140" y="322" font-size="10.5" fill="#3f51b5">● 询问</text><text x="200" y="322" font-size="10.5" fill="#ef6c00">● 指路（去问谁）</text><text x="300" y="322" font-size="10.5" fill="#43a047">● 答案</text>';
    $("map").innerHTML = s;
  }
  function show() {
    draw();
    $("log").innerHTML = steps.slice(0, k).map(function (m, i) { return '<li class="' + (i === k - 1 ? "cur" : "") + '">' + N[m.a].t + " → " + N[m.b].t + "</li>"; }).join("");
    $("next").disabled = $("all").disabled = k >= steps.length;
    if (k > 0) $("msg").textContent = steps[k - 1].txt;
    if (k === steps.length && steps.length) {
      var d = $("dom").value, n = steps.length;
      if (!cacheHost[d]) { cacheHost[d] = true; cacheNS = true; }
      $("msg").textContent += "　共 " + n + " 个报文。" + (n === 2 ? "缓存让查询一步完成。" : "再点一次“开始查询”，看缓存的效果。");
    }
    var c = Object.keys(cacheHost).map(function (d) { return d + " → 192.168.8.130"; });
    if (cacheNS) c.push("xiaohe.com 的权威服务器 → 已知");
    $("cache").textContent = c.length ? c.join("；") : "（空）";
  }
  $("go").onclick = function () { steps = plan(); k = 1; show(); };
  $("next").onclick = function () { if (k < steps.length) { k++; show(); } };
  $("all").onclick = function () { k = steps.length; show(); };
  $("clr").onclick = function () { cacheHost = {}; cacheNS = false; steps = []; k = 0; show(); $("msg").textContent = "缓存已清空，下次查询要从根服务器问起。"; };
  show(); $("msg").textContent = "缓存是空的。点“开始查询”。";
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
