<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLAN 隔离广播</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
#net { width:100%; display:block; }
.pcg { cursor:pointer; }
.t { font-size:13px; text-anchor:middle; pointer-events:none; }
.s { font-size:11px; text-anchor:middle; fill:#555; pointer-events:none; }
.vsel { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; font-size:12px; text-align:center; }
.vsel select { width:100%; font-size:12px; }
</style>
</head>
<body>
<h1>VLAN 隔离广播：广播帧能到哪些电脑？</h1>
<div class="sub">在下面给每台电脑所接的接口选择 VLAN，然后<b>点图中任意一台电脑</b>让它发一个广播帧。绿色表示收到了广播，灰色表示没收到。</div>
<div class="row ex"><span class="lbl">试试：</span><button data-p="1,1,1,1,1,1">不划分（全在 VLAN 1）</button><button data-p="10,10,20,20,30,30">按部门划分</button><button data-p="10,20,10,20,30,10">部门座位交错</button></div>
<div class="vsel" id="vsel"></div>
<svg id="net" viewBox="0 0 760 260"></svg>
<div class="box"><h2 id="t">点一台电脑发广播</h2><div class="msg" id="msg"></div></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  var VC = { 1: "#90a4ae", 10: "#3f51b5", 20: "#e53935", 30: "#43a047" };
  var VN = { 1: "VLAN 1 默认", 10: "VLAN 10 设计部", 20: "VLAN 20 财务部", 30: "VLAN 30 访客" };
  var who = ["小林", "阿美", "陈姐", "会计小王", "访客甲", "访客乙"];
  var vlan = [1, 1, 1, 1, 1, 1], src = -1;
  function el(tag, a, txt) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; }
  $("vsel").innerHTML = who.map(function (w, i) {
    return '<div>Fa0/' + (i + 1) + '<br><select data-i="' + i + '">' + [1, 10, 20, 30].map(function (v) { return '<option value="' + v + '">' + VN[v] + "</option>"; }).join("") + "</select></div>";
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function (s) { s.onchange = function () { vlan[+s.dataset.i] = +s.value; src = -1; draw(); }; });
  function draw() {
    var svg = $("net"); svg.innerHTML = "";
    svg.appendChild(el("rect", { x: 230, y: 20, width: 300, height: 46, rx: 6, fill: "#37474f" }));
    svg.appendChild(el("text", { x: 380, y: 49, "class": "t", fill: "#fff" }, "交换机（一台）"));
    who.forEach(function (w, i) {
      var x = 70 + i * 124, got = src >= 0 && i !== src && vlan[i] === vlan[src];
      var on = src >= 0 && (i === src || got);
      svg.appendChild(el("line", { x1: 260 + i * 48, y1: 66, x2: x, y2: 170, stroke: on ? VC[vlan[i]] : "#cfd8dc", "stroke-width": on ? 5 : 3, "stroke-dasharray": on && i !== src ? "8 5" : "" }));
      var g = el("g", { "class": "pcg" });
      g.appendChild(el("rect", { x: x - 48, y: 170, width: 96, height: 60, rx: 6, fill: i === src ? "#fff8e1" : got ? "#e8f5e9" : src >= 0 ? "#f5f5f5" : "#fff", stroke: VC[vlan[i]], "stroke-width": 3 }));
      g.appendChild(el("text", { x: x, y: 194, "class": "t" }, w));
      g.appendChild(el("text", { x: x, y: 214, "class": "s" }, "VLAN " + vlan[i] + (i === src ? " · 发送" : got ? " · 收到" : "")));
      g.onclick = function () { src = i; draw(); };
      svg.appendChild(g);
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function (s) { s.value = vlan[+s.dataset.i]; });
    if (src < 0) { $("t").textContent = "点一台电脑发广播"; $("msg").textContent = "当前有 " + new Set(vlan).size + " 个 VLAN，也就是 " + new Set(vlan).size + " 个广播域。"; return; }
    var rec = who.filter(function (w, i) { return i !== src && vlan[i] === vlan[src]; });
    $("t").textContent = who[src] + "（VLAN " + vlan[src] + "）发出广播";
    $("msg").innerHTML = rec.length ? "收到广播的有：<b>" + rec.join("、") + "</b>。其他 VLAN 的电脑收不到，即使它们接在同一台交换机上。" : "同一 VLAN 里没有别的电脑，广播谁也没收到。";
    $("msg").innerHTML += "<br>全网共有 " + new Set(vlan).size + " 个广播域。";
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-p]"), function (b) { b.onclick = function () { vlan = b.dataset.p.split(",").map(Number); src = 0; draw(); }; });
  draw();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
