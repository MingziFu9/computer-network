<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二进制转换器</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.bulbs { display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; margin:10px 0; }
.bulb { border:2px solid var(--line); border-radius:10px; padding:8px 0; text-align:center; cursor:pointer; user-select:none; background:#fafafa; }
.bulb .w { font-size:13px; color:var(--muted); }
.bulb .d { font-size:26px; font-family:monospace; font-weight:bold; color:#bbb; }
.bulb.on { background:#fff8e1; border-color:#f9a825; }
.bulb.on .d { color:#e65100; }
.out { font-size:15px; line-height:2; }
.out b { font-family:monospace; font-size:20px; }
input[type=number] { width:6em; font-size:15px; }
.mode button.on { background:var(--accent); color:#fff; }
</style>
</head>
<body>
<h1>二进制转换器：点亮 8 个灯</h1>
<div class="sub">每个灯代表一位，从左到右的值是 128、64、32、16、8、4、2、1。亮（1）就加上它的值，灭（0）就不加。</div>
<div class="row mode"><button data-m="free" class="on">自由练习</button><button data-m="quiz">练一练</button>
  <span id="freebox">十进制：<input type="number" id="dec" min="0" max="255" value="192"> <button id="go">转成二进制</button></span></div>
<div class="row ex" id="exrow"><span class="lbl">掩码常用值：</span><button data-v="128">128</button><button data-v="192">192</button><button data-v="224">224</button><button data-v="240">240</button><button data-v="248">248</button><button data-v="252">252</button><button data-v="255">255</button><button data-v="168">168</button><button data-v="100">100</button></div>
<div class="bulbs" id="bulbs"></div>
<div class="box"><div class="out" id="out"></div><div class="msg" id="msg"></div></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var W = [128, 64, 32, 16, 8, 4, 2, 1], bits = [0, 0, 0, 0, 0, 0, 0, 0], mode = "free", q = null;
  function val() { return bits.reduce(function (s, b, i) { return s + b * W[i]; }, 0); }
  function set(v) { bits = W.map(function (w) { if (v >= w) { v -= w; return 1; } return 0; }); }
  function render() {
    $("bulbs").innerHTML = W.map(function (w, i) { return '<div class="bulb' + (bits[i] ? " on" : "") + '" data-i="' + i + '"><div class="w">' + w + '</div><div class="d">' + bits[i] + "</div></div>"; }).join("");
    Array.prototype.forEach.call(document.querySelectorAll(".bulb"), function (b) { b.onclick = function () { bits[+b.dataset.i] ^= 1; render(); check(); }; });
    var v = val(), parts = W.filter(function (w, i) { return bits[i]; });
    var ones = bits.join("").match(/^1*/)[0].length, isMask = /^1*0*$/.test(bits.join(""));
    $("out").innerHTML = "二进制 <b>" + bits.join("") + "</b>　=　十进制 <b>" + v + "</b><br>" +
      (parts.length ? parts.join(" + ") + " = " + v : "全灭 = 0") +
      (isMask && mode === "free" ? "<br>这是一个可以出现在子网掩码里的值：前面 " + ones + " 个 1，后面 " + (8 - ones) + " 个 0。" : "");
  }
  function newQ() {
    var dir = Math.random() < .5 ? "d2b" : "b2d", v = Math.floor(Math.random() * 256);
    q = { dir: dir, v: v }; bits = [0, 0, 0, 0, 0, 0, 0, 0];
    if (dir === "b2d") set(v);
    render();
    $("msg").innerHTML = dir === "d2b" ? "题目：把十进制 <b>" + v + "</b> 变成二进制。点亮正确的灯，答对会自动提示。" :
      '题目：上面的二进制是多少？<input type="number" id="ans" min="0" max="255"> <button id="sub">提交</button> <button id="nx">换一题</button>';
    if (dir === "b2d") {
      $("out").innerHTML = "二进制 <b>" + bits.join("") + "</b>　=　十进制 <b>?</b>";
      $("sub").onclick = function () { var a = +$("ans").value; $("msg").innerHTML = (a === v ? '<span class="ok">答对了！</span>' : '<span class="bad">不对，</span>正确答案是 ' + v + "：" + W.filter(function (w, i) { return bits[i]; }).join(" + ") + "。") + ' <button id="nx2">下一题</button>'; $("nx2").onclick = newQ; };
      $("nx").onclick = newQ;
    }
  }
  function check() {
    if (mode !== "quiz" || !q) return;
    if (q.dir === "b2d") { newQ(); return; }
    if (val() === q.v) { $("msg").innerHTML = '<span class="ok">答对了！</span>' + q.v + " = " + bits.join("") + ' <button id="nx3">下一题</button>'; $("nx3").onclick = newQ; }
  }
  $("go").onclick = function () { var v = Math.max(0, Math.min(255, Math.round(+$("dec").value || 0))); $("dec").value = v; set(v); render(); $("msg").textContent = "从 128 开始，能减就减、写 1，不够减写 0。"; };
  Array.prototype.forEach.call(document.querySelectorAll("[data-v]"), function (b) { b.onclick = function () { mode = "free"; set(+b.dataset.v); render(); $("msg").textContent = ""; }; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-m]"), function (b) {
    b.onclick = function () {
      mode = b.dataset.m;
      Array.prototype.forEach.call(document.querySelectorAll("[data-m]"), function (x) { x.className = x === b ? "on" : ""; });
      $("freebox").style.display = $("exrow").style.display = mode === "free" ? "" : "none";
      if (mode === "quiz") newQ(); else { q = null; $("msg").textContent = ""; render(); }
    };
  });
  set(192); render();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
