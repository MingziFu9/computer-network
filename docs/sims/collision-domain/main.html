<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冲突域与广播域</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
#net { width:100%; display:block; }
.dev { cursor:pointer; }
.t { font-size:13px; text-anchor:middle; pointer-events:none; }
.s { font-size:11px; text-anchor:middle; fill:#666; pointer-events:none; }
</style>
</head>
<body>
<h1>冲突域与广播域：换一换设备，看范围怎么变</h1>
<div class="sub">点中间和两边的设备可以切换类型（中间：集线器 → 交换机 → 路由器；两边：集线器 ↔ 交换机）。每种颜色的连线是一个<b>冲突域</b>；虚线大框是一个<b>广播域</b>。</div>
<div class="row ex"><span class="lbl">试试：</span>
  <button data-p="hub,hub,hub">全用集线器</button><button data-p="hub,switch,hub">集线器 + 中间交换机</button>
  <button data-p="switch,switch,switch">全用交换机</button><button data-p="switch,router,switch">交换机 + 中间路由器</button><button data-p="hub,router,switch">左集线器 + 路由器 + 右交换机</button></div>
<svg id="net" viewBox="0 0 760 330"></svg>
<div class="box"><h2>冲突域 <span class="big" id="nc"></span> 个　·　广播域 <span class="big" id="nb"></span> 个</h2><div class="msg" id="msg"></div></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  var NAME = { hub: "集线器", "switch": "交换机", router: "路由器" };
  var FILL = { hub: "#90a4ae", "switch": "#37474f", router: "#1565c0" };
  var PAL = ["#e53935", "#43a047", "#1e88e5", "#fb8c00", "#8e24aa", "#00897b", "#6d4c41", "#c0ca33"];
  var type = { L: "hub", C: "switch", R: "hub" };
  var pos = { L: [190, 120], C: [380, 60], R: [570, 120], L1: [90, 260], L2: [190, 260], L3: [290, 260], R1: [470, 260], R2: [570, 260], R3: [670, 260] };
  var links = [["C", "L"], ["C", "R"], ["L", "L1"], ["L", "L2"], ["L", "L3"], ["R", "R1"], ["R", "R2"], ["R", "R3"]];
  function el(tag, a, txt) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; }
  function groups(merge) {   // 在 merge(设备类型) 为真的设备处，把相连的链路合并成一组
    var g = links.map(function (_, i) { return i; });
    function f(x) { return g[x] === x ? x : (g[x] = f(g[x])); }
    ["L", "C", "R"].forEach(function (d) {
      if (!merge(type[d])) return;
      var ids = []; links.forEach(function (l, i) { if (l[0] === d || l[1] === d) ids.push(i); });
      ids.forEach(function (i) { g[f(i)] = f(ids[0]); });
    });
    return links.map(function (_, i) { return f(i); });
  }
  function draw() {
    var svg = $("net"); svg.innerHTML = "";
    var cg = groups(function (t) { return t === "hub"; });
    var bg = groups(function (t) { return t !== "router"; });
    var cIds = [], bIds = [];
    cg.forEach(function (x) { if (cIds.indexOf(x) < 0) cIds.push(x); });
    bg.forEach(function (x) { if (bIds.indexOf(x) < 0) bIds.push(x); });
    if (type.C === "router") {
      svg.appendChild(el("rect", { x: 40, y: 88, width: 335, height: 222, rx: 16, fill: "none", stroke: "#5c6bc0", "stroke-width": 2, "stroke-dasharray": "8 6" }));
      svg.appendChild(el("rect", { x: 385, y: 88, width: 335, height: 222, rx: 16, fill: "none", stroke: "#5c6bc0", "stroke-width": 2, "stroke-dasharray": "8 6" }));
    } else svg.appendChild(el("rect", { x: 30, y: 25, width: 700, height: 290, rx: 16, fill: "none", stroke: "#5c6bc0", "stroke-width": 2, "stroke-dasharray": "8 6" }));
    links.forEach(function (l, i) {
      var a = pos[l[0]], b = pos[l[1]];
      svg.appendChild(el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: PAL[cIds.indexOf(cg[i]) % PAL.length], "stroke-width": 5 }));
    });
    ["L", "C", "R"].forEach(function (d) {
      var p = pos[d], g = el("g", { "class": "dev" });
      g.appendChild(el("rect", { x: p[0] - 50, y: p[1] - 20, width: 100, height: 40, rx: 6, fill: FILL[type[d]] }));
      g.appendChild(el("text", { x: p[0], y: p[1] + 5, "class": "t", fill: "#fff" }, NAME[type[d]] + " ⟳"));
      g.onclick = function () {
        var order = d === "C" ? ["hub", "switch", "router"] : ["hub", "switch"];
        type[d] = order[(order.indexOf(type[d]) + 1) % order.length]; draw();
      };
      svg.appendChild(g);
    });
    ["L1", "L2", "L3", "R1", "R2", "R3"].forEach(function (d, k) {
      var p = pos[d];
      svg.appendChild(el("rect", { x: p[0] - 32, y: p[1] - 18, width: 64, height: 36, rx: 5, fill: "#fff", stroke: "#90a4ae", "stroke-width": 2 }));
      svg.appendChild(el("text", { x: p[0], y: p[1] + 5, "class": "t" }, "PC" + (k + 1)));
    });
    $("nc").textContent = cIds.length; $("nb").textContent = bIds.length;
    var tips = [];
    ["L", "C", "R"].forEach(function (d) {
      var where = d === "C" ? "中间" : d === "L" ? "左边" : "右边";
      if (type[d] === "hub") tips.push(where + "的集线器把它连着的所有线路并成一个冲突域");
      if (type[d] === "switch") tips.push(where + "的交换机每个接口各是一个冲突域，但广播照样通过");
      if (type[d] === "router") tips.push("中间的路由器把网络分成两个广播域");
    });
    $("msg").textContent = tips.join("；") + "。";
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-p]"), function (b) {
    b.onclick = function () { var t = b.dataset.p.split(","); type = { L: t[0], C: t[1], R: t[2] }; draw(); };
  });
  draw();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
