# 站点名、描述、网址和 nav 由 python tools/course.py sync 根据 course.yml 生成，请改 course.yml，不要手改这几项
site_name: 计算机网络
site_description: 面向成人教育人工智能技术应用专业（专科）的《计算机网络》教材，零基础起步，每章配套 3 个动手实验，贯穿“小禾设计工作室”组网项目
site_url: https://mingzifu9.github.io/computer-network/
repo_url: https://github.com/MingziFu9/computer-network
docs_dir: docs
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - abbr
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_css:
  - css/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/book.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
nav:
  - 首页: index.md
  - 课程描述: course-description.md
  - "第 1 章 认识计算机网络": chapters/01-intro/index.md
  - "第 2 章 网络体系结构：分层与协议": chapters/02-architecture/index.md
  - "第 3 章 物理层：从比特到信号": chapters/03-physical/index.md
  - "第 4 章 数据链路层与以太网交换": chapters/04-datalink/index.md
  - "第 5 章 VLAN 与无线局域网": chapters/05-vlan-wlan/index.md
  - "第 6 章 IP 地址：IPv4、子网划分与 IPv6": chapters/06-ip-address/index.md
  - "第 7 章 路由：数据包怎么找路": chapters/07-routing/index.md
  - "第 8 章 网络层的好帮手：ARP、ICMP、DHCP 与 NAT": chapters/08-arp-dhcp-nat/index.md
  - "第 9 章 传输层：TCP 与 UDP": chapters/09-transport/index.md
  - "第 10 章 应用层：域名、网页与常用服务": chapters/10-application/index.md
  - "第 11 章 网络安全": chapters/11-security/index.md
  - "第 12 章 网络管理、新技术与综合项目": chapters/12-management/index.md
  - 交互动画:
    - sims/index.md
    - "电路交换与分组交换": sims/circuit-vs-packet/index.md
    - "时延计算器": sims/delay-calculator/index.md
  - 学习图谱: learning-graph/index.md
  - 常见问题: faq/index.md
  - "在线模拟卷": mock-exam.md
  - 附录:
    - "附录 A 常用网络命令速查": appendix/a-commands.md
    - "附录 B 实验环境与资源说明": appendix/b-environment.md
    - "附录 C Cisco 与华为命令对照": appendix/c-huawei.md
    - "附录 D 术语表": appendix/glossary.md
    - "附录 E 实验报告模板与综合项目指南": appendix/e-project.md
