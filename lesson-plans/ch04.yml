objectives:
  knowledge:
  - 说出数据链路层要解决的三个基本问题，以及 MAC 地址的长度和结构
  - 说出以太网帧各字段的名称和长度，在抓包结果中找出源 MAC、目的 MAC 和类型
  - 解释交换机怎样自学习、转发、泛洪和过滤
  skill:
  - 比较集线器、交换机和路由器，数出一个网络中冲突域和广播域的个数
  - 在 Packet Tracer 中用交换机搭建一个小型局域网，并用命令查看 MAC 地址表
  quality:
  - 【待填】职业素养、科学态度或科技伦理方面的目标，1–2 条
key_points:
- 数据链路层要做什么
- 以太网与 MAC 地址
- 以太网帧格式
- 共享介质与 CSMA/CD
difficulties:
- point: 【待填】学生最容易卡住的 1–2 个难点
  solution: 【待填】突破难点的办法，如动画演示、手算例子
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 90
    content: 阅读网页教材第 4 章 数据链路层与以太网交换的情景导入和第一节，操作交互动画“冲突域与广播域”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: 情景导入：工作室的网络终于要“正规化”了。禾姐买回来一台 24 口的交换机，让小林把办公室的五台电脑都接上。小林把网线一根根插好，……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 5
    content: 4.1 数据链路层要做什么：链路、数据链路和帧、封装成帧与透明传输、差错检测、点对点链路与 PPP
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 4.2 以太网与 MAC 地址：以太网是什么、MAC 地址、单播、广播和多播
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 4.3 以太网帧格式：帧的各个字段、在抓包里认出以太网帧
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 4.4 共享介质与 CSMA/CD：早期以太网、为什么今天不再需要 CSMA/CD
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授与演示
    minutes: 5
    content: 4.5 集线器与交换机：集线器、交换机、冲突域与广播域
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“冲突域与广播域”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 【待填】
  - name: 讲授与演示
    minutes: 5
    content: 4.6 交换机怎样工作：自学习、转发、泛洪和过滤、交换机的其他特点
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“交换机自学习”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 4.7 以太网的发展与交换机的接口：从 10M 到 800G、看懂交换机的接口和指示灯
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 4.8 本章常见问题对照
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 拓展
    minutes: 5
    content: 4.9 AI 与网络：AI 集群为什么要“更快的以太网”
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 实验
    minutes: 5
    content: 实验 4-1 在抓包里看以太网帧
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 在 Wireshark 中找到以太网帧的目的地址、源地址和类型字段；根据 MAC 地址的前 24 位查出网卡厂商；用 P
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：一台交换机刚开机，MAC 地址表为空。电脑 A、B、C 分别接在 1、2、3 号接口。依次发生：① A 发帧给 C；② C 发帧给 A；③ B 发广播帧。请写出每一步交换机学到了什么、怎样处理这个帧，以及最后地址表的内容。
- 简答题：某网络中，路由器 R 的两个接口分别连接交换机 S1 和 S2。S1 连接 PC1、PC2 和一台集线器 H，H 下面连接 PC3、PC4；S2 连接 PC5、PC6。这个网络有几个冲突域、几个广播域？说明理由。
- 简答题：下面是在 Wireshark 字节窗格中看到的某个帧的前 14 个字节：`00 e0 fc 12 34 01 00 e0 4c 68 01 0a 08 00`。请写出这个帧的目的 MAC 地址、源 MAC 地址、类型，并说明它是单播还是广播。
- 实操题：在 Packet Tracer 中，小林执行 `show mac address-table` 后看到下面的输出（输出格式示意）。请回答：① 这些记录是怎么来的？② 如果此时一台 MAC 地址为 `0002.16a8.4c07` 的电脑接在 Fa0/7 上，第一次发帧给 `0060.2f4d.9e13`，交换机会怎样处理？③ 小林想让交换机重新学习，应输入什么命令？
- 实验报告：实验 4-1、实验 4-2、实验 4-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
