# 第 5 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 5
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出 VLAN 的作用，以及 Access 口和 Trunk 口的区别
  - 解释 802.1Q 标签加在帧的什么位置、有什么用，在抓包中找出 VLAN 号
  - 说出 WiFi 4/5/6/7 对应的标准，比较 2.4 GHz 和 5 GHz 的特点，解释为什么要错开信道
  skill:
  - 在 Packet Tracer 中创建 VLAN、把接口划入 VLAN、配置 Trunk，并验证隔离效果
  - 按照安全要求设置无线路由器的 SSID、加密方式和访客网络
  quality:
  - 按部门划分网络、保护财务数据，树立信息安全和隐私保护意识
  - 无线网络使用强密码和 WPA3，养成安全配置的职业习惯
key_points:
- VLAN 的作用与配置
- Access 口、Trunk 口与 802.1Q 标签
- 环路与生成树
- 2.4 GHz 与 5 GHz、信道选择
- 无线加密方式
difficulties:
- point: Access 口与 Trunk 口、标签何时加何时去不易理解
  solution: 用 VLAN 隔离动画和 vlan_trunk.pcap 对照，强调“Trunk 上带标签、Access 口发给电脑不带”
- point: Packet Tracer 中 VLAN 配置步骤多、容易漏
  solution: 板书“建 VLAN → 划接口 → 设 Trunk”三步，配合 show vlan brief、show interfaces trunk 检查
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 30
    content: 5.1 为什么要划分 VLAN：广播太多的烦恼、VLAN
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 理解 VLAN 隔离广播域的作用
  - name: 自主学习
    minutes: 30
    content: 5.2 Access 口、Trunk 口与 802.1Q：Access 口、Trunk 口、802.1Q 标签、VLAN 怎样配置（Cisco 命令一览）
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 掌握 Access 口、Trunk 口和 802.1Q 标签
  - name: 自主学习
    minutes: 30
    content: 5.3 不同 VLAN 之间怎样通信
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 知道 VLAN 之间要靠三层设备互通，为第 7 章铺垫
  - name: 自主学习
    minutes: 30
    content: 5.4 冗余、环路与生成树：多连一根线，网络反而瘫痪了、生成树协议、链路聚合（了解）
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 理解环路的危害和生成树的作用
  - name: 自主学习
    minutes: 25
    content: 5.5 无线局域网：802.11 与 WiFi 的代际、2.4 GHz 与 5 GHz、信道、CSMA/CA
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 会选择频段和信道，理解 CSMA/CA
  - name: 自主学习
    minutes: 25
    content: 5.6 无线组网与安全：无线路由器、AP 与 AC、加密方式、安全又快的无线网络
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会安全地设置无线网络
  - name: 自主学习
    minutes: 5
    content: 5.7 本章常见问题对照
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 把概念和常见故障对应起来
  - name: 自主学习
    minutes: 5
    content: 5.8 AI 与网络：给智能设备单独一个网络
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 联系智能设备的安全隔离
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：半年过去，小禾工作室从 5 个人发展到了 20 多人，分成了设计部和财务部，前台还专门给来访的客户留了几个座位。人一多，……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 10
    content: 5.2 Access 口、Trunk 口与 802.1Q：Access 口、Trunk 口、802.1Q 标签、VLAN 怎样配置（Cisco 命令一览）
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 掌握 Access 口、Trunk 口和 802.1Q 标签
  - name: 重点讲解
    minutes: 10
    content: 5.5 无线局域网：802.11 与 WiFi 的代际、2.4 GHz 与 5 GHz、信道、CSMA/CA
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 会选择频段和信道，理解 CSMA/CA
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 5-1 按部门划分 VLAN
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中，为课后提交实验报告做准备
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：小禾工作室有设计部、财务部和访客区，只有一台 24 口交换机。请说明怎样用 VLAN 满足“财务单独隔开、访客不能访问内部”的要求，并说出划分 VLAN 的三个好处。
- 简答题：比较 CSMA/CD 和 CSMA/CA：分别用在什么网络中？对碰撞的处理思路有什么不同？无线局域网为什么不能使用 CSMA/CD？
- 简答题：下面是 Wireshark 中某帧的前 18 个字节：`ff ff ff ff ff ff 00 e0 4c 20 00 11 81 00 00 14 08 06`。请写出目的 MAC 地址、源 MAC 地址、这个帧属于哪个 VLAN，以及里面装的是什么协议。
- 实操题：补全下面的思科交换机配置命令：创建 VLAN 20 并命名为 Finance，把 Fa0/3 划入 VLAN 20，再把连接另一台交换机的 Gi0/1 设为 Trunk 口。
- 实验报告：实验 5-1、实验 5-2、实验 5-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
