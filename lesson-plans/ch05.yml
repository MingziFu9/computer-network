    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: 情景导入：半年过去，小禾工作室从 5 个人发展到了 20 多人，分成了设计部和财务部，前台还专门给来访的客户留了几个座位。人一多，……
