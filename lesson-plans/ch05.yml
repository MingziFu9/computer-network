    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 5.7 本章常见问题对照
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 拓展
    minutes: 5
    content: 5.8 AI 与网络：给智能设备单独一个网络
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
