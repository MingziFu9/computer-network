# 第 1 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 1
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出计算机网络的定义、三类组成部分和常见分类
  - 解释分组交换为什么比电路交换更适合互联网
  skill:
  - 计算发送时延和传播时延，换算 Mbps 与 MB/s
  - 使用 `ipconfig` 和 `ping` 查看本机网络信息、测量往返时间和丢包率
  - 画出家庭或单位的网络草图，判断网络慢的原因可能出在哪一段
  quality:
  - 养成先画网络草图、用数据说话的排障习惯，不凭感觉下结论
  - 了解我国互联网发展历程和“东数西算”工程，增强科技自信
key_points:
- 计算机网络的组成与分类
- 电路交换与分组交换的比较
- 速率换算与发送时延、传播时延的计算
- 往返时间与丢包率的测量
difficulties:
- point: 发送时延与传播时延容易混淆，误以为带宽越高信号跑得越快
  solution: 用“装车时间”和“路上开车时间”比喻，配合时延计算器动画改变速率和距离，对比两项时延的变化
- point: Mbps 与 MB/s 的换算
  solution: 以“100 兆宽带下载只有 12 MB/s”的生活疑问引入，现场换算并让学生测自己的宽带
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 30
    content: 1.1 什么是计算机网络：一条微信消息的旅程、计算机网络的定义、网络能做什么、互联网与互连网
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 从一条微信消息的旅程建立网络的整体印象
  - name: 自主学习
    minutes: 30
    content: 1.2 网络由什么组成：三类组成部分、边缘部分与核心部分、家庭和小办公室的网络长什么样
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 用快递比喻认识三类组成，为画网络草图做准备
  - name: 自主学习
    minutes: 30
    content: 1.3 网络的分类：按覆盖范围分、按拓扑结构分、按使用者分
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 掌握两种主要分类方法，认识星形和网状拓扑
  - name: 自主学习
    minutes: 30
    content: 1.4 数据是怎样“交换”的：电路交换、报文交换、分组交换、三种方式比一比
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 用动画对比交换方式，理解互联网为什么用分组交换
  - name: 自主学习
    minutes: 25
    content: 1.5 怎样说网络“好不好”：速率与带宽、吞吐量、时延、往返时间与丢包率等
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 通过例题掌握单位换算和两种时延，解释生活中的“网速”问题
  - name: 自主学习
    minutes: 25
    content: 1.6 互联网是怎样发展起来的：从 ARPANET 到移动互联网、中国互联网的发展、标准由谁来定
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解互联网和标准组织，知道 RFC 是什么
  - name: 自主学习
    minutes: 5
    content: 1.7 本章常见问题对照
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 把概念和生活中的现象对应起来
  - name: 自主学习
    minutes: 5
    content: 1.8 AI 与网络：大模型离不开的网络
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 联系人工智能，激发对后续内容的兴趣
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: |-
      情景导入：小林刚到“小禾设计工作室”上班。工作室只有 5 个人，租了写字楼里一间办公室，老板禾姐让他兼管电脑和网络。

      上班第一天……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 10
    content: 1.4 数据是怎样“交换”的：电路交换、报文交换、分组交换、三种方式比一比
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 用动画对比交换方式，理解互联网为什么用分组交换
  - name: 重点讲解
    minutes: 10
    content: 1.5 怎样说网络“好不好”：速率与带宽、吞吐量、时延、往返时间与丢包率等
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 通过例题掌握单位换算和两种时延，解释生活中的“网速”问题
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 1-1 摸清我的网络：ipconfig 与网络草图
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中，为课后提交实验报告做准备
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用寄快递的比喻说明分组交换的工作过程，并说出它的两个优点和一个缺点。
- 简答题：说出时延的四个组成部分，并指出其中哪一部分变化最大、为什么。
- 简答题：禾姐反映：工作室办的是 300 Mbps 宽带，可她在会议室用笔记本测速只有 40 Mbps，而小林在路由器旁边用网线测有 280 Mbps。请分析原因并提出改进建议。
- 实操题：在自己的电脑上完成：① 用 `ipconfig` 查出默认网关；② 用 `ping -n 10` 分别测试网关和一个国内网站；③ 把两个平均往返时间填入表格，并说明哪一段链路贡献了大部分时延。
- 实验报告：实验 1-1、实验 1-2、实验 1-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
