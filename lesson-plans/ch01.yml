# 第 1 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 1
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出计算机网络的定义、三类组成部分和常见分类
  - 解释分组交换为什么比电路交换更适合互联网
  skill:
  - 计算发送时延和传播时延，换算 Mbps 与 MB/s
  - 使用 `ipconfig` 和 `ping` 查看本机网络信息、测量往返时间和丢包率
  - 画出家庭或单位的网络草图，判断网络慢的原因可能出在哪一段
  quality:
  - 【待填】职业素养、科学态度或科技伦理方面的目标，1–2 条
key_points:
- 什么是计算机网络
- 网络由什么组成
- 网络的分类
- 数据是怎样“交换”的
difficulties:
- point: 【待填】学生最容易卡住的 1–2 个难点
  solution: 【待填】突破难点的办法，如动画演示、手算例子
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 90
    content: 阅读网页教材第 1 章 认识计算机网络的情景导入和第一节，操作交互动画“电路交换与分组交换”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: '情景导入：小林刚到“小禾设计工作室”上班。工作室只有 5 个人，租了写字楼里一间办公室，老板禾姐让他兼管电脑和网络。


      上班第一天……'
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 5
    content: 1.1 什么是计算机网络：一条微信消息的旅程、计算机网络的定义、网络能做什么、互联网与互连网
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 1.2 网络由什么组成：三类组成部分、边缘部分与核心部分、家庭和小办公室的网络长什么样
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 1.3 网络的分类：按覆盖范围分、按拓扑结构分、按使用者分
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授与演示
    minutes: 5
    content: 1.4 数据是怎样“交换”的：电路交换、报文交换、分组交换、三种方式比一比
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“电路交换与分组交换”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 【待填】
  - name: 讲授与演示
    minutes: 5
    content: 1.5 怎样说网络“好不好”：速率与带宽、吞吐量、时延、往返时间与丢包率等
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“时延计算器”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 1.6 互联网是怎样发展起来的：从 ARPANET 到移动互联网、中国互联网的发展、标准由谁来定
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 1.7 本章常见问题对照
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 拓展
    minutes: 5
    content: 1.8 AI 与网络：大模型离不开的网络
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 实验
    minutes: 5
    content: 实验 1-1 摸清我的网络：ipconfig 与网络草图
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 会打开命令提示符，用 `ipconfig` 和 `ipconfig /all` 查看本机的网络信息；认识 IP 地址、子
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用寄快递的比喻说明分组交换的工作过程，并说出它的两个优点和一个缺点。
- 简答题：说出时延的四个组成部分，并指出其中哪一部分变化最大、为什么。
- 简答题：禾姐反映：工作室办的是 300 Mbps 宽带，可她在会议室用笔记本测速只有 40 Mbps，而小林在路由器旁边用网线测有 280 Mbps。请分析原因并提出改进建议。
- 实操题：在自己的电脑上完成：① 用 `ipconfig` 查出默认网关；② 用 `ping -n 10` 分别测试网关和一个国内网站；③ 把两个平均往返时间填入表格，并说明哪一段链路贡献了大部分时延。
- 实验报告：实验 1-1、实验 1-2、实验 1-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
