homework:
- 简答与计算题：某主机的 IP 地址为 10.1.1.200，子网掩码为 255.255.255.240。求：① 网络地址；② 广播地址；③ 可用地址范围；④ 这个子网最多能容纳几台主机。写出计算过程。
- 简答与计算题：某公司分得网段 192.168.50.0/24，有三个部门：销售部 100 台、技术部 50 台、行政部 20 台（均含网关）。请用变长子网划分为三个部门分配子网，写出每个子网的网络地址、前缀长度、可用地址范围和广播地址。
- '简答与计算题：下面是 Wireshark 中一个 IP 数据报首部的部分信息：`Time to Live: 128`、`Protocol: UDP (17)`、`Source Address: 192.168.8.71`、`Destination Address: 192.168.8.101`。请回答：① 数据部分交给哪个上层协议？② 如果两台主机的掩码都是 /27，它们在不在同一网段？③ 发送方可能是什么操作系统？说明理由。'
- 实操题：小林在 Packet Tracer 中给财务部的 PC2 配置了 IP 地址 192.168.8.71、子网掩码 255.255.255.192，给 PC3 配置了 192.168.8.72、子网掩码 255.255.255.224，两台在同一个 VLAN。结果发现部分通信异常。请指出问题，并按实验 6-2 的规划给出正确配置，以及验证的方法。
- 实验报告：实验 6-1、实验 6-2、实验 6-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
