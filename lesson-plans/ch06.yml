# 第 6 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 6
online: 4
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出网络层的任务，以及 IPv4 地址的长度、写法和组成
  - 识别 A、B、C 类地址、私有地址和特殊地址
  - 说出 IPv6 地址的长度和缩写规则，查看本机的 IPv6 地址
  skill:
  - 完成二进制与十进制的互换
  - 根据 IP 地址和子网掩码算出网络地址、广播地址和可用地址范围，判断两台电脑是否在同一网段
  - 根据各部门人数完成子网划分和地址规划，并用 Python 验算
  quality:
  - 子网规划先算后配、工具验算，培养严谨的工程习惯
  - 在使用大模型等工具时保持独立判断，做到“AI 起草，工具验算，人来把关”
key_points:
- 二进制与十进制的换算
- IP 地址分类、特殊地址和私有地址
- 网络地址、广播地址和可用地址范围的计算
- 等长与变长子网划分
- IPv6 地址的简写
difficulties:
- point: 子网划分计算步骤多，学生容易在块大小和边界上出错
  solution: 统一使用“块大小”法，配合速查表和子网划分计算器动画；线下 2 学时安排分层练习，先单题后综合
- point: 变长子网划分的分配顺序和对齐规则
  solution: 以工作室 50/20/20/5 为例，强调“从大到小、网络地址是块大小的整数倍”，再用 Python ipaddress 验算
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 20
    content: 6.1 网络层与 IP 协议：网络层要做什么、IP 协议
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 理解网络层与 IP 协议“尽力而为”的特点
  - name: 自主学习
    minutes: 20
    content: 6.2 二进制与十进制：八位二进制、二进制转十进制、十进制转二进制
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 掌握八位二进制换算，为子网计算打基础
  - name: 自主学习
    minutes: 20
    content: 6.3 IPv4 地址：点分十进制与两级结构、分类的 IP 地址（考点）、特殊地址（考点）、私有地址
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会判断地址类别、特殊地址和私有地址
  - name: 自主学习
    minutes: 20
    content: 6.4 子网掩码与 CIDR：子网掩码、CIDR 与斜线记法、求网络地址、判断两台电脑是否在同一网段
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会求网络地址、广播地址和可用范围，会判断是否同一网段
  - name: 自主学习
    minutes: 15
    content: 6.5 子网划分：为什么要划分子网、等长子网划分、变长子网划分、速查表等
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 掌握等长和变长子网划分，完成工作室地址规划
  - name: 自主学习
    minutes: 15
    content: 6.6 IPv4 数据报的格式：首部的关键字段、分片（了解）
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 认识 IPv4 首部的 TTL、协议等关键字段
  - name: 自主学习
    minutes: 15
    content: 6.7 IPv6：为什么需要 IPv6、IPv6 地址的写法、IPv6 的好处与我国的部署
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会写和简写 IPv6 地址
  - name: 自主学习
    minutes: 5
    content: 6.8 本章常见问题对照
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 把计算和常见故障对应起来
  - name: 自主学习
    minutes: 5
    content: 6.9 AI 与网络：大模型帮你算子网，靠得住吗？
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 正确看待大模型算子网
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：工作室搬进了一个创意园区。园区统一管理网络，网管小郑给小禾工作室分配了一个网段：`192.168.8.0/24`，并叮嘱……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 15
    content: 6.3 IPv4 地址：点分十进制与两级结构、分类的 IP 地址（考点）、特殊地址（考点）、私有地址
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 会判断地址类别、特殊地址和私有地址
  - name: 重点讲解
    minutes: 15
    content: 6.4 子网掩码与 CIDR：子网掩码、CIDR 与斜线记法、求网络地址、判断两台电脑是否在同一网段
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 会求网络地址、广播地址和可用范围，会判断是否同一网段
  - name: 重点讲解
    minutes: 15
    content: 6.5 子网划分：为什么要划分子网、等长子网划分、变长子网划分、速查表等
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 掌握等长和变长子网划分，完成工作室地址规划
  - name: 分层练习
    minutes: 20
    content: 按基础题、提高题、综合题三层安排本章计算题的课堂练习，学生独立完成后同桌互查
    teacher: 分层布置练习，巡视指导，集中讲评典型错误
    student: 独立完成练习，同桌互查，订正错误
    intent: 通过反复练习突破本章计算难点
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 6-1 子网划分练习
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中，为课后提交实验报告做准备
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答与计算题：某主机的 IP 地址为 10.1.1.200，子网掩码为 255.255.255.240。求：① 网络地址；② 广播地址；③ 可用地址范围；④ 这个子网最多能容纳几台主机。写出计算过程。
- 简答与计算题：某公司分得网段 192.168.50.0/24，有三个部门：销售部 100 台、技术部 50 台、行政部 20 台（均含网关）。请用变长子网划分为三个部门分配子网，写出每个子网的网络地址、前缀长度、可用地址范围和广播地址。
- '简答与计算题：下面是 Wireshark 中一个 IP 数据报首部的部分信息：`Time to Live: 128`、`Protocol: UDP (17)`、`Source Address: 192.168.8.71`、`Destination Address: 192.168.8.101`。请回答：① 数据部分交给哪个上层协议？② 如果两台主机的掩码都是 /27，它们在不在同一网段？③ 发送方可能是什么操作系统？说明理由。'
- 实操题：小林在 Packet Tracer 中给财务部的 PC2 配置了 IP 地址 192.168.8.71、子网掩码 255.255.255.192，给 PC3 配置了 192.168.8.72、子网掩码 255.255.255.224，两台在同一个 VLAN。结果发现部分通信异常。请指出问题，并按实验 6-2 的规划给出正确配置，以及验证的方法。
- 实验报告：实验 6-1、实验 6-2、实验 6-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
