# 第 7 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 7
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出路由器“转发”和“路由”两项工作的区别，以及路由器与交换机的区别
  - 看懂路由表，用最长前缀匹配判断数据报从哪里转发
  - 比较 RIP 和 OSPF 的工作思路，用最短路径算法算出一个小网络的最短路径
  skill:
  - 在 Packet Tracer 中配置路由器接口、静态路由和默认路由，让两个网络互通
  - 配置 OSPF，观察链路断开后路由自动切换
  - 用 `tracert` 追踪数据包经过的路由器，分析哪一跳最慢
  quality:
  - 配置路由时“来回都要有”，养成全面思考、逐项验证的习惯
  - 了解软件定义网络和 AI 运维，感受网络技术的发展
key_points:
- 转发与路由选择
- 路由表、默认路由与最长前缀匹配
- 静态路由的配置
- RIP 与 OSPF 的比较、最短路径
- 三层交换机 VLAN 间路由
difficulties:
- point: 最长前缀匹配判断出错
  solution: 用路由查找动画输入不同目的地址，列出所有匹配项后再选最长的
- point: 静态路由只配一边导致不通
  solution: 在 Packet Tracer 中故意只配一边，让学生观察 ping 失败，再补上回程路由
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 30
    content: 7.1 路由器做什么：转发与路由、路由器与交换机的区别、跨网络时，地址怎么变
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 理解路由器的两项工作，区分路由器与交换机
  - name: 自主学习
    minutes: 30
    content: 7.2 路由表：路由表长什么样、默认路由、最长前缀匹配（考点）
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 会看路由表，掌握最长前缀匹配
  - name: 自主学习
    minutes: 30
    content: 7.3 静态路由：手工写一条路、静态路由的优缺点
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会配置静态路由和默认路由
  - name: 自主学习
    minutes: 30
    content: 7.4 动态路由：路由器之间互相“打听路”：距离向量与 RIP、链路状态与 OSPF、最短路径算法、自治系统与 BGP（了解）等
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 理解 RIP、OSPF 的思路，会按表格算最短路径
  - name: 自主学习
    minutes: 25
    content: 7.5 三层交换机与 VLAN 间路由
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会用三层交换机实现 VLAN 间路由
  - name: 自主学习
    minutes: 25
    content: 7.6 用 tracert 看数据包走过的路
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会用 tracert 追踪路径
  - name: 自主学习
    minutes: 5
    content: 7.7 本章常见问题对照
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 把概念和常见故障对应起来
  - name: 自主学习
    minutes: 5
    content: 7.8 AI 与网络：让 AI 帮网络“看路况”
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解 SDN 和 AI 在路由中的应用
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小禾工作室的生意越来越好，禾姐在城市另一头开了一家分店。分店有十来个人，用的是 192.168.9.0/24 网段；总部……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 10
    content: 7.2 路由表：路由表长什么样、默认路由、最长前缀匹配（考点）
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 会看路由表，掌握最长前缀匹配
  - name: 重点讲解
    minutes: 10
    content: 7.3 静态路由：手工写一条路、静态路由的优缺点
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 会配置静态路由和默认路由
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 7-1 静态路由连通分店
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中，为课后提交实验报告做准备
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答与计算题：网络中有 4 台路由器 A、B、C、D，链路代价为：A–B 1，A–C 4，B–C 2，B–D 6，C–D 1。用最短路径算法求 A 到其他路由器的最短路径和代价，写出每一步。
- 简答与计算题：比较 RIP 和 OSPF：分别属于哪类路由协议？用什么衡量路径？和谁交换什么信息？各适合多大的网络？
- 简答与计算题：某路由器的路由表如下：① 192.168.1.0/24 直连 Gi0/0；② 10.0.0.0/8 下一跳 10.1.1.2；③ 10.20.0.0/16 下一跳 10.1.1.6；④ 0.0.0.0/0 下一跳 203.0.113.1。分别说明目的地址为 10.20.3.4、10.30.3.4、192.168.1.77、8.8.8.8 的数据报如何转发。
- 实操题：实验 7-1 中，小林在 R1 上配置了 `ip route 192.168.9.0 255.255.255.0 10.0.12.2`，PC0 和 PC1 的地址、网关都正确，但 PC0 仍然 ping 不通 PC1。R1 的 `show ip route` 中已经有 `S 192.168.9.0/24` 这一行。请分析最可能的原因，写出排查用的命令和解决命令。
- 实验报告：实验 7-1、实验 7-2、实验 7-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
