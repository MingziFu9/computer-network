# 第 2 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 2
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出协议的三要素，以及 OSI 七层模型各层的名称和顺序
  - 解释网络为什么要分层，五层模型中每层负责什么、数据单位叫什么
  - 描述数据从发送方到接收方逐层封装、解封装的过程
  skill:
  - 使用 Wireshark 打开抓包文件、用显示过滤器找到 DNS、TCP、HTTP 数据
  - 判断一个协议或一台设备属于哪一层
  quality:
  - 体会分层、分工协作的工程思想，学会把复杂问题拆解
  - 树立网络安全法律意识：只在有权抓包的网络中抓包
key_points:
- 协议三要素
- OSI 七层模型各层名称和顺序
- 五层模型各层的作用、PDU 和典型设备
- 封装与解封装的过程
difficulties:
- point: 七层、四层、五层模型容易混淆，PDU 名称记不住
  solution: 用对照表一张表讲清三种模型，配合口诀“物数网传会表应”和课堂抢答
- point: 封装、解封装过程抽象
  solution: 用封装动画一步步加首部、拆首部，再用 Wireshark 打开 web_visit.pcap 第 10 帧逐层展开
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 25
    content: 2.1 协议：网络里的“约定”：什么是协议、协议的三要素、协议是谁定的
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 用打电话的比喻理解协议三要素
  - name: 自主学习
    minutes: 25
    content: 2.2 为什么要分层：寄一封信的过程、分层的好处、体系结构
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 用寄信的过程体会分层的好处
  - name: 自主学习
    minutes: 25
    content: 2.3 OSI 七层模型：七层各做什么、OSI 为什么没有流行起来
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 记住七层名称和顺序，了解 OSI 的地位
  - name: 自主学习
    minutes: 25
    content: 2.4 TCP/IP 模型与五层模型：TCP/IP 四层模型、本书使用的五层模型、每一层到底在干什么
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 掌握本书使用的五层模型，能判断设备所在层次
  - name: 自主学习
    minutes: 25
    content: 2.5 封装与解封装：层层“装信封”、层层“拆信封”、中间设备拆到哪一层
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 通过动画和算一算理解封装与解封装
  - name: 自主学习
    minutes: 25
    content: 2.6 服务、接口与协议
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 区分服务（垂直）与协议（水平）
  - name: 自主学习
    minutes: 20
    content: 2.7 用 Wireshark 看见分层：Wireshark 是什么、认识 Wireshark 的界面、显示过滤器
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 第一次使用 Wireshark，亲眼看到分层
  - name: 自主学习
    minutes: 5
    content: 2.8 本章常见问题对照
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 澄清常见的混淆点
  - name: 自主学习
    minutes: 5
    content: 2.9 AI 与网络：一次大模型调用穿过的五层
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 用一次大模型调用串起五层
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小林在第 1 章摸清了工作室网络的样子，可还是想不通一件事：阿美用的是苹果笔记本，陈姐用的是 Windows 台式机，打……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 10
    content: 2.4 TCP/IP 模型与五层模型：TCP/IP 四层模型、本书使用的五层模型、每一层到底在干什么
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 掌握本书使用的五层模型，能判断设备所在层次
  - name: 重点讲解
    minutes: 10
    content: 2.5 封装与解封装：层层“装信封”、层层“拆信封”、中间设备拆到哪一层
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 通过动画和算一算理解封装与解封装
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 2-1 安装 Wireshark，打开抓包文件看五层
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中，为课后提交实验报告做准备
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用寄信的例子说明网络为什么要分层，并说出分层的两个好处。
- 简答题：画出五层模型，写出每层的名称、协议数据单元和一个代表协议（或设备）。
- 简答题：阿美的电脑把网页请求发给服务器，中间经过一台交换机和一台路由器。请说明数据在这四台设备上分别被处理到哪一层，为什么交换机和路由器不需要处理到应用层？
- 实操题：打开 `labs/data/pcap/web_visit.pcap`：① 用过滤器只显示 HTTP，写出看到的帧编号；② 选中服务器回复的 `200 OK`，写出它的源 IP、目的 IP、源端口、目的端口；③ 与浏览器发出的请求相比，说明这些地址和端口有什么规律。
- 实验报告：实验 2-1、实验 2-2、实验 2-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
