chapter: 2
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出协议的三要素，以及 OSI 七层模型各层的名称和顺序
  - 解释网络为什么要分层，五层模型中每层负责什么、数据单位叫什么
  - 描述数据从发送方到接收方逐层封装、解封装的过程
  skill:
  - 使用 Wireshark 打开抓包文件、用显示过滤器找到 DNS、TCP、HTTP 数据
  - 判断一个协议或一台设备属于哪一层
  quality:
  - 【待填】职业素养、科学态度或科技伦理方面的目标，1–2 条
key_points:
- 协议：网络里的“约定”
- 为什么要分层
- OSI 七层模型
- TCP/IP 模型与五层模型
difficulties:
- point: 【待填】学生最容易卡住的 1–2 个难点
  solution: 【待填】突破难点的办法，如动画演示、手算例子
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 90
    content: 阅读网页教材第 2 章 网络体系结构：分层与协议的情景导入和第一节，操作交互动画“层层装信封”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: 情景导入：小林在第 1 章摸清了工作室网络的样子，可还是想不通一件事：阿美用的是苹果笔记本，陈姐用的是 Windows 台式机，打……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 5
    content: 2.1 协议：网络里的“约定”：什么是协议、协议的三要素、协议是谁定的
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 2.2 为什么要分层：寄一封信的过程、分层的好处、体系结构
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 2.3 OSI 七层模型：七层各做什么、OSI 为什么没有流行起来
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 2.4 TCP/IP 模型与五层模型：TCP/IP 四层模型、本书使用的五层模型、每一层到底在干什么
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授与演示
    minutes: 5
    content: 2.5 封装与解封装：层层“装信封”、层层“拆信封”、中间设备拆到哪一层
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“层层装信封”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 2.6 服务、接口与协议
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 2.7 用 Wireshark 看见分层：Wireshark 是什么、认识 Wireshark 的界面、显示过滤器
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 2.8 本章常见问题对照
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 拓展
    minutes: 5
    content: 2.9 AI 与网络：一次大模型调用穿过的五层
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 实验
    minutes: 5
    content: 实验 2-1 安装 Wireshark，打开抓包文件看五层
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 安装 Wireshark，认识它的三栏界面；打开抓包文件 `web_visit.pcap`，找到网页请求，在分组详情中认
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用寄信的例子说明网络为什么要分层，并说出分层的两个好处。
- 简答题：画出五层模型，写出每层的名称、协议数据单元和一个代表协议（或设备）。
- 简答题：阿美的电脑把网页请求发给服务器，中间经过一台交换机和一台路由器。请说明数据在这四台设备上分别被处理到哪一层，为什么交换机和路由器不需要处理到应用层？
- 实操题：打开 `labs/data/pcap/web_visit.pcap`：① 用过滤器只显示 HTTP，写出看到的帧编号；② 选中服务器回复的 `200 OK`，写出它的源 IP、目的 IP、源端口、目的端口；③ 与浏览器发出的请求相比，说明这些地址和端口有什么规律。
- 实验报告：实验 2-1、实验 2-2、实验 2-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
