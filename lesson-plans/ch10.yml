# 第 10 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 10
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出客户—服务器模式和 P2P 模式的区别，以及常用应用层协议的作用和端口号
  - 描述域名的层次结构，区分递归查询和迭代查询
  - 拆分一个 URL 的各个部分，读懂 HTTP 请求和响应，说出常见状态码的含义
  - 说出发送和接收电子邮件分别用什么协议
  skill:
  - 按顺序描述“在浏览器中输入网址到看到网页”经过的步骤，说出每一步用到的协议
  - 用 `nslookup` 和浏览器开发者工具查看域名解析和网页请求，在 Packet Tracer 中配置 Web、DNS 和邮件服务器
  quality:
  - 【待填】职业素养、科学态度或科技伦理方面的目标，1–2 条
key_points:
- 应用层与两种工作模式
- 域名系统 DNS（考点）
- 万维网与 HTTP
- 输入网址之后发生了什么
difficulties:
- point: 【待填】学生最容易卡住的 1–2 个难点
  solution: 【待填】突破难点的办法，如动画演示、手算例子
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 90
    content: 阅读网页教材第 10 章 应用层：域名、网页与常用服务的情景导入和第一节，操作交互动画“DNS 查询之旅”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: 情景导入：工作室的网络连通了，地址也能自动分配，禾姐想更进一步：“我们自己做一个内部网站，把例会时间、项目进度、请假表格都放上去，……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 5
    content: 10.1 应用层与两种工作模式：应用层做什么、客户—服务器模式、对等网络 P2P
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授与演示
    minutes: 5
    content: 10.2 域名系统 DNS（考点）：为什么需要域名、域名的层次结构、域名服务器、递归查询与迭代查询（考点）等
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“DNS 查询之旅”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 10.3 万维网与 HTTP：URL、HTTP 请求与响应、请求方法、状态码（考点）等
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授与演示
    minutes: 5
    content: 10.4 输入网址之后发生了什么
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“输入网址之后”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 10.5 Web API 与 JSON
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 10.6 电子邮件：邮件地址和邮件系统的组成、SMTP、POP3 与 IMAP（考点）
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 10.7 文件传输与远程登录：FTP 与 SFTP、远程登录
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 10.8 其他常用服务
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 10.9 本章常见问题对照
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 拓展
    minutes: 5
    content: 10.10 AI 与网络：大模型 API 的一次请求长什么样
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 实验
    minutes: 5
    content: 实验 10-1 查域名、看网页请求
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 用 `nslookup` 查询域名对应的 IP 地址；用浏览器开发者工具查看一个网页包含的请求、状态码和耗时；理解 UR
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用“打听一家店”的比喻说明递归查询和迭代查询的区别，并说明为什么根域名服务器一般不提供递归查询。
- 简答题：小林的电脑刚开机并已通过 DHCP 获得地址，他在浏览器中输入 `http://www.xiaohe.com` 并回车。请按顺序写出直到看到网页的主要步骤，以及每一步用到的协议。
- 简答题：下面是一个 HTTP 响应的开头。请说出第一行三部分的含义，以及 Content-Length 和空行的作用。
- 实操题：在实验 10-2 中，阿美的电脑（PC1）用 `http://192.168.8.130` 能打开内部网站，用 `http://www.xiaohe.com` 却显示 “Host Name Unresolved”。请写出排查步骤和每一步要检查的内容。
- 实验报告：实验 10-1、实验 10-2、实验 10-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
