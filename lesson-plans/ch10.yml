# 第 10 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 10
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出客户—服务器模式和 P2P 模式的区别，以及常用应用层协议的作用和端口号
  - 描述域名的层次结构，区分递归查询和迭代查询
  - 拆分一个 URL 的各个部分，读懂 HTTP 请求和响应，说出常见状态码的含义
  - 说出发送和接收电子邮件分别用什么协议
  skill:
  - 按顺序描述“在浏览器中输入网址到看到网页”经过的步骤，说出每一步用到的协议
  - 用 `nslookup` 和浏览器开发者工具查看域名解析和网页请求，在 Packet Tracer 中配置 Web、DNS 和邮件服务器
  quality:
  - 妥善保管 API 密钥等凭证，养成保护账号安全的职业习惯
  - 体会互联网服务“开放标准、互联互通”的价值
key_points:
- DNS 的层次结构与递归、迭代查询
- URL 与 HTTP 请求、响应
- HTTP 状态码
- 输入网址后发生的全过程
- 邮件协议与端口
difficulties:
- point: 递归查询与迭代查询容易混淆
  solution: 用 DNS 查询之旅动画切换两种模式，配合“秘书代办”与“逐个指路”的比喻
- point: 输入网址后的全过程涉及多层协议，学生难以串起来
  solution: 用 web_visit.pcap 的 18 帧和“输入网址之后”动画逐步讲解，每一步标出对应章节
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 25
    content: 10.1 应用层与两种工作模式：应用层做什么、客户—服务器模式、对等网络 P2P
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 区分客户—服务器与 P2P 模式
  - name: 自主学习
    minutes: 25
    content: 10.2 域名系统 DNS（考点）：为什么需要域名、域名的层次结构、域名服务器、递归查询与迭代查询（考点）等
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 理解 DNS 的工作过程（考点）
  - name: 自主学习
    minutes: 20
    content: 10.3 万维网与 HTTP：URL、HTTP 请求与响应、请求方法、状态码（考点）等
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 读懂 URL、HTTP 报文和状态码
  - name: 自主学习
    minutes: 20
    content: 10.4 输入网址之后发生了什么
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 把全书各层协议串成一次完整的访问
  - name: 自主学习
    minutes: 20
    content: 10.5 Web API 与 JSON
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 认识 Web API 与 JSON
  - name: 自主学习
    minutes: 20
    content: 10.6 电子邮件：邮件地址和邮件系统的组成、SMTP、POP3 与 IMAP（考点）
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 掌握邮件的三个协议
  - name: 自主学习
    minutes: 20
    content: 10.7 文件传输与远程登录：FTP 与 SFTP、远程登录
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 区分 FTP、Telnet、SSH 和远程桌面
  - name: 自主学习
    minutes: 20
    content: 10.8 其他常用服务
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解其他常用服务
  - name: 自主学习
    minutes: 5
    content: 10.9 本章常见问题对照
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 把概念和常见故障对应起来
  - name: 自主学习
    minutes: 5
    content: 10.10 AI 与网络：大模型 API 的一次请求长什么样
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 看懂一次大模型 API 请求
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：工作室的网络连通了，地址也能自动分配，禾姐想更进一步：“我们自己做一个内部网站，把例会时间、项目进度、请假表格都放上去，……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 10
    content: 10.2 域名系统 DNS（考点）：为什么需要域名、域名的层次结构、域名服务器、递归查询与迭代查询（考点）等
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 理解 DNS 的工作过程（考点）
  - name: 重点讲解
    minutes: 10
    content: 10.4 输入网址之后发生了什么
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 把全书各层协议串成一次完整的访问
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 10-1 查域名、看网页请求
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中，为课后提交实验报告做准备
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用“打听一家店”的比喻说明递归查询和迭代查询的区别，并说明为什么根域名服务器一般不提供递归查询。
- 简答题：小林的电脑刚开机并已通过 DHCP 获得地址，他在浏览器中输入 `http://www.xiaohe.com` 并回车。请按顺序写出直到看到网页的主要步骤，以及每一步用到的协议。
- 简答题：下面是一个 HTTP 响应的开头。请说出第一行三部分的含义，以及 Content-Length 和空行的作用。
- 实操题：在实验 10-2 中，阿美的电脑（PC1）用 `http://192.168.8.130` 能打开内部网站，用 `http://www.xiaohe.com` 却显示 “Host Name Unresolved”。请写出排查步骤和每一步要检查的内容。
- 实验报告：实验 10-1、实验 10-2、实验 10-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
