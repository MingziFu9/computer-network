# 第 11 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 11
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出网络安全的三个基本目标，识别钓鱼、勒索软件、DDoS、中间人、ARP 欺骗等常见威胁
  - 区分对称加密和非对称加密，解释哈希、数字签名和数字证书各解决什么问题
  - 说清 HTTPS 怎样保护数据，查看网站证书的关键信息
  - 说出我国网络安全相关法律的要点，养成良好的个人安全习惯
  skill:
  - 读懂访问控制列表的规则，按从上到下的顺序判断一个数据包被允许还是拒绝
  - 在 Packet Tracer 中配置扩展 ACL，实现部门之间的访问控制
  quality:
  - 【待填】职业素养、科学态度或科技伦理方面的目标，1–2 条
key_points:
- 网络安全要保护什么
- 密码学的直观
- HTTPS 为什么安全
- 防火墙与访问控制列表
difficulties:
- point: 【待填】学生最容易卡住的 1–2 个难点
  solution: 【待填】突破难点的办法，如动画演示、手算例子
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 90
    content: 阅读网页教材第 11 章 网络安全的情景导入和第一节，操作交互动画“对称与非对称加密”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: 情景导入：周一早上，阿美收到一封邮件，发件人显示“小禾设计工作室 财务部”，标题是“【紧急】十月工资调整确认，今日下班前未确认将影……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 5
    content: 11.1 网络安全要保护什么：三个基本目标（考点）、常见威胁一览
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授与演示
    minutes: 5
    content: 11.2 密码学的直观：对称加密、非对称加密、哈希、数字签名与数字证书
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“对称与非对称加密”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 11.3 HTTPS 为什么安全：HTTPS = HTTP + TLS、TLS 握手的直观、浏览器上的锁和证书
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授与演示
    minutes: 5
    content: 11.4 防火墙与访问控制列表：防火墙、访问控制列表 ACL（考点）、入侵检测、入侵防御与 VPN
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“防火墙规则匹配”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 11.5 个人与小单位的安全习惯
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 11.6 法律与规范
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 11.7 本章常见问题对照
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 拓展
    minutes: 5
    content: 11.8 AI 与网络：AI 让攻击和防守都升级了
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 实验
    minutes: 5
    content: 实验 11-1 看懂证书，对比 HTTP 明文和 HTTPS 密文
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 在浏览器中查看网站证书的颁发对象、颁发者和有效期；在抓包文件中找到 HTTP 明文传送的密码，确认 HTTPS 中看不到
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：说明 HTTPS 是怎样综合运用数字证书、非对称加密和对称加密来保证安全的。为什么不全部使用非对称加密？
- 简答题：某路由器接口上配置了如下 ACL（in 方向），判断下列数据包是允许还是拒绝，并说明匹配的是哪一条规则：
- 简答题：阿美收到一封“财务部”发来的邮件，要求她点链接登录确认工资，她照做后账号被盗。请指出这封邮件可能有哪些可疑之处，并给出事后补救和今后预防的措施。
- 实操题：工作室要求访客区（192.168.8.96/27）不能访问内网任何地址（192.168.8.0/24），但可以访问互联网。请写出一个扩展 ACL（编号 130），并写出把它应用到三层交换机 VLAN 30 接口的命令，说明应选择 in 还是 out 方向。
- 实验报告：实验 11-1、实验 11-2、实验 11-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
