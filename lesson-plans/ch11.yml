# 第 11 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 11
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出网络安全的三个基本目标，识别钓鱼、勒索软件、DDoS、中间人、ARP 欺骗等常见威胁
  - 区分对称加密和非对称加密，解释哈希、数字签名和数字证书各解决什么问题
  - 说清 HTTPS 怎样保护数据，查看网站证书的关键信息
  - 说出我国网络安全相关法律的要点，养成良好的个人安全习惯
  skill:
  - 读懂访问控制列表的规则，按从上到下的顺序判断一个数据包被允许还是拒绝
  - 在 Packet Tracer 中配置扩展 ACL，实现部门之间的访问控制
  quality:
  - 遵守《网络安全法》等法律法规，只在授权范围内进行安全测试
  - 养成强口令、双因素认证、定期备份等安全习惯，提高防骗意识
key_points:
- 安全的三个基本目标
- 对称加密、非对称加密、哈希与数字签名
- HTTPS 的原理
- ACL 的匹配规则与编写
- 网络安全相关法律
difficulties:
- point: 对称、非对称加密和数字签名中谁用公钥、谁用私钥容易记混
  solution: 用加密动画分别操作，总结“加密用对方公钥，签名用自己私钥”
- point: ACL 规则顺序和通配符掩码
  solution: 用防火墙规则匹配动画调整规则顺序观察结果变化，通配符掩码用“255 减掩码”速算
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 30
    content: 11.1 网络安全要保护什么：三个基本目标（考点）、常见威胁一览
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 理解安全的三个目标和常见威胁
  - name: 自主学习
    minutes: 30
    content: 11.2 密码学的直观：对称加密、非对称加密、哈希、数字签名与数字证书
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 建立密码学的直观认识
  - name: 自主学习
    minutes: 30
    content: 11.3 HTTPS 为什么安全：HTTPS = HTTP + TLS、TLS 握手的直观、浏览器上的锁和证书
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 理解 HTTPS 为什么安全，正确看待“小锁”
  - name: 自主学习
    minutes: 30
    content: 11.4 防火墙与访问控制列表：防火墙、访问控制列表 ACL（考点）、入侵检测、入侵防御与 VPN
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 会编写简单的 ACL，了解防火墙、IDS、IPS 和 VPN
  - name: 自主学习
    minutes: 25
    content: 11.5 个人与小单位的安全习惯
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 养成个人和单位的安全习惯
  - name: 自主学习
    minutes: 25
    content: 11.6 法律与规范
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解网络安全法律法规，守住底线
  - name: 自主学习
    minutes: 5
    content: 11.7 本章常见问题对照
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 把概念和常见问题对应起来
  - name: 自主学习
    minutes: 5
    content: 11.8 AI 与网络：AI 让攻击和防守都升级了
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 认识 AI 带来的新攻击和新防守
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：周一早上，阿美收到一封邮件，发件人显示“小禾设计工作室 财务部”，标题是“【紧急】十月工资调整确认，今日下班前未确认将影……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 10
    content: 11.2 密码学的直观：对称加密、非对称加密、哈希、数字签名与数字证书
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 建立密码学的直观认识
  - name: 重点讲解
    minutes: 10
    content: 11.4 防火墙与访问控制列表：防火墙、访问控制列表 ACL（考点）、入侵检测、入侵防御与 VPN
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 会编写简单的 ACL，了解防火墙、IDS、IPS 和 VPN
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 11-1 看懂证书，对比 HTTP 明文和 HTTPS 密文
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中，为课后提交实验报告做准备
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：说明 HTTPS 是怎样综合运用数字证书、非对称加密和对称加密来保证安全的。为什么不全部使用非对称加密？
- 简答题：某路由器接口上配置了如下 ACL（in 方向），判断下列数据包是允许还是拒绝，并说明匹配的是哪一条规则：
- 简答题：阿美收到一封“财务部”发来的邮件，要求她点链接登录确认工资，她照做后账号被盗。请指出这封邮件可能有哪些可疑之处，并给出事后补救和今后预防的措施。
- 实操题：工作室要求访客区（192.168.8.96/27）不能访问内网任何地址（192.168.8.0/24），但可以访问互联网。请写出一个扩展 ACL（编号 130），并写出把它应用到三层交换机 VLAN 30 接口的命令，说明应选择 in 还是 out 方向。
- 实验报告：实验 11-1、实验 11-2、实验 11-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
