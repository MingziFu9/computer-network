    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 23
    content: 9.4 三次握手与四次挥手（考点）：三次握手、数据传输、四次挥手
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 掌握三次握手和四次挥手（考点）
  - name: 重点讲解
    minutes: 22
    content: 9.6 拥塞控制：别把路堵死：什么是拥塞、四种算法（考点）
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 掌握拥塞控制四种算法（考点）
  - name: 分层练习
    minutes: 20
    content: 按基础题、提高题、综合题三层安排本章计算题的课堂练习，学生独立完成后同桌互查
    teacher: 分层布置练习，巡视指导，集中讲评典型错误
    student: 独立完成练习，同桌互查，订正错误
    intent: 通过反复练习突破本章计算难点
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 9-1 在抓包里找三次握手和四次挥手
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中，为课后提交实验报告做准备
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答与计算题：用“打电话”的比喻描述 TCP 三次握手的过程，写出每个报文段的标志位，以及序号和确认号的关系（设客户端初始序号为 x，服务器初始序号为 y）。为什么不能只握手两次？
- 简答与计算题：某 TCP 连接的慢开始门限初始为 12，拥塞窗口从 1 开始。在拥塞窗口为 16 的那一轮发送后发生超时；超时后重新开始，在拥塞窗口为 10 的那一轮发送后收到 3 个重复确认。写出各轮的拥塞窗口，直到收到 3 个重复确认后的第 2 轮。
- 简答与计算题：下面是某 TCP 连接中的三个报文段（相对序号）：① A→B，序号 1，确认号 1，数据 50 字节；② B→A，序号 1，确认号 ____，数据 80 字节；③ A→B，序号 ____，确认号 ____，数据 0 字节。请填空，并说明报文段 ② 体现了什么机制。
- '实操题：小林运行实验 9-2 的客户端程序时，看到 `ConnectionRefusedError: [WinError 10061]`；他确认服务器程序已经运行，窗口显示“服务器在 9000 端口等待连接……”。请列出至少三种可能的原因和对应的检查方法。'
- 实验报告：实验 9-1、实验 9-2、实验 9-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
