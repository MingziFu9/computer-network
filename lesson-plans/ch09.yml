# 第 9 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 9
online: 4
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出运输层的作用，以及常用应用对应的端口号
  - 比较 UDP 和 TCP 的特点，为不同的应用选择合适的协议
  - 描述 TCP 三次握手和四次挥手的过程，在抓包中找出相应的报文和序号变化
  - 解释 TCP 怎样用序号、确认和超时重传实现可靠传输，用滑动窗口做流量控制
  skill:
  - 根据给定条件算出拥塞窗口的变化
  - 用 Python 运行一个 TCP 聊天程序，用 `netstat` 查看连接状态
  quality:
  - 理解 TCP 可靠传输“确认、重传”的思想，做事有回应、有始有终
  - 拥塞控制体现“各让一步、共同受益”，培养协作意识
key_points:
- 端口号与常用端口
- UDP 与 TCP 的比较
- 三次握手与四次挥手
- 序号与确认号的计算
- 拥塞控制的四种算法
difficulties:
- point: 三次握手、四次挥手中序号和确认号的变化
  solution: 用握手动画逐帧演示，切换“真实序号”与抓包文件 tcp_udp_chat.pcap 对照，总结“确认号 = 对方序号 + 数据长度，SYN、FIN 各占一个序号”
- point: 拥塞窗口变化的计算
  solution: 用滑动窗口动画重现例题，线下画表格逐轮推导，区分超时与 3 个重复确认的不同处理
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 20
    content: 9.1 运输层做什么：从主机到进程、端口号、常用端口号（考点）、套接字
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 理解端口号的作用，记住常用端口
  - name: 自主学习
    minutes: 20
    content: 9.2 UDP：简单、快、不保证送到：UDP 的特点、UDP 适合什么应用
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 认识 UDP 的特点和适用场景
  - name: 自主学习
    minutes: 20
    content: 9.3 TCP：面向连接、可靠：TCP 的特点、TCP 首部的关键字段
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 掌握 TCP 首部关键字段
  - name: 自主学习
    minutes: 20
    content: 9.4 三次握手与四次挥手（考点）：三次握手、数据传输、四次挥手
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 掌握三次握手和四次挥手（考点）
  - name: 自主学习
    minutes: 15
    content: 9.5 可靠传输与流量控制：可靠传输、滑动窗口、流量控制
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 理解可靠传输、滑动窗口和流量控制
  - name: 自主学习
    minutes: 15
    content: 9.6 拥塞控制：别把路堵死：什么是拥塞、四种算法（考点）
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 掌握拥塞控制四种算法（考点）
  - name: 自主学习
    minutes: 15
    content: 9.7 TCP 与 UDP 怎么选：选择的原则、QUIC 与 HTTP/3（了解）
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会根据应用需求选择 TCP 或 UDP
  - name: 自主学习
    minutes: 5
    content: 9.8 本章常见问题对照
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 把概念和编程、使用中的现象对应起来
  - name: 自主学习
    minutes: 5
    content: 9.9 AI 与网络：大模型的回答为什么一个字一个字“蹦”出来
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 解释大模型“流式输出”背后的网络原理
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：周五下午，小林的电脑上同时开着好几样东西：和分店的视频会议、网盘正在下载上周的设计稿、微信不停地弹出消息、浏览器里还开着……
