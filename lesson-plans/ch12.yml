# 第 12 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 12
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出网络管理的五大功能，解释 SNMP 中管理站、代理和 MIB 的作用
  - 说出 QoS、SDN、VPC、5G、物联网、算力网络等新技术解决什么问题
  skill:
  - 按由下往上的顺序，运用 ipconfig、ping、nslookup、tracert 和设备 show 命令定位常见网络故障
  - 按“需求分析 → 拓扑设计 → 地址规划 → 设备选型 → 安全设计 → 测试验收 → 文档”的流程，完成一个小型网络的组网方案
  - 用 Python 编写简单的网络巡检工具
  quality:
  - 故障排查按层、有序、有记录，培养严谨务实的职业素养
  - 综合项目分组协作，培养沟通、分工和文档撰写能力
key_points:
- 网络管理五大功能与 SNMP
- 分层排查思路与六步法
- 常见故障的定位与处理
- 小型网络规划设计流程
difficulties:
- point: 面对故障不知从何下手
  solution: 用故障排查闯关动画练习六步法，再在实验 12-1 中两人互设故障、互相排查
- point: 综合项目内容多，学生难以统筹
  solution: 按附录 E 的进度安排和方案模板分阶段检查，每周提交一部分，教师及时反馈
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 35
    content: 12.1 网络管理做什么：网络管理的五大功能、SNMP、日志与远程管理
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解网络管理五大功能和 SNMP
  - name: 自主学习
    minutes: 35
    content: 12.2 故障排查方法（考点）：排查的基本思路、命令组合、常见故障案例库
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 掌握分层排查和六步法（考点）
  - name: 自主学习
    minutes: 30
    content: 12.3 网络优化（了解）
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解网络优化的常见方向
  - name: 自主学习
    minutes: 30
    content: 12.4 新技术一览（了解）
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解网络新技术及其应用
  - name: 自主学习
    minutes: 30
    content: 12.5 小型网络规划设计流程
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 掌握小型网络规划设计流程，为综合项目做准备
  - name: 自主学习
    minutes: 10
    content: 12.6 本章常见问题对照
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 把概念和常见故障对应起来
  - name: 自主学习
    minutes: 10
    content: 12.7 AI 与网络：智能运维 AIOps
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解智能运维，正确使用 AI 工具
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: |-
      情景导入：周一早上九点，工作室群里炸开了锅。

      阿美：“上不了网了！”陈姐：“我这边也是，网页打不开。”小周：“我的微信还能发消息……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 10
    content: 12.2 故障排查方法（考点）：排查的基本思路、命令组合、常见故障案例库
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 掌握分层排查和六步法（考点）
  - name: 重点讲解
    minutes: 10
    content: 12.5 小型网络规划设计流程
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 掌握小型网络规划设计流程，为综合项目做准备
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 12-1 故障排查闯关
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中，为课后提交实验报告做准备
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：一台 Windows 电脑上不了网，请按顺序写出六步排查法，并说明每一步不正常时说明了什么问题。
- '简答题：分店电脑能 ping 通分店路由器（192.168.9.1），ping 总部服务器 192.168.8.130 时，显示“来自 192.168.9.1 的回复: 无法访问目标网络”。请分析原因，写出在分店路由器 R2 上的检查命令和一种解决方法（R1 与 R2 互联地址：R1 10.0.12.1，R2 10.0.12.2）。'
- 简答题：简述小型网络规划设计的七个步骤，并以小禾设计工作室为例，说明“地址规划”这一步要确定哪些内容。
- 实操题：补全下面在路由器 R1 上开启 SSH、禁止 Telnet 的配置：
- 实验报告：实验 12-1、实验 12-2、实验 12-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
