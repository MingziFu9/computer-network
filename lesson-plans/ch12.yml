chapter: 12
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出网络管理的五大功能，解释 SNMP 中管理站、代理和 MIB 的作用
  - 说出 QoS、SDN、VPC、5G、物联网、算力网络等新技术解决什么问题
  skill:
  - 按由下往上的顺序，运用 ipconfig、ping、nslookup、tracert 和设备 show 命令定位常见网络故障
  - 按“需求分析 → 拓扑设计 → 地址规划 → 设备选型 → 安全设计 → 测试验收 → 文档”的流程，完成一个小型网络的组网方案
  - 用 Python 编写简单的网络巡检工具
  quality:
  - 【待填】职业素养、科学态度或科技伦理方面的目标，1–2 条
key_points:
- 网络管理做什么
- 故障排查方法（考点）
- 网络优化（了解）
- 新技术一览（了解）
difficulties:
- point: 【待填】学生最容易卡住的 1–2 个难点
  solution: 【待填】突破难点的办法，如动画演示、手算例子
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 90
    content: 阅读网页教材第 12 章 网络管理、新技术与综合项目的情景导入和第一节，操作交互动画“故障排查闯关”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: '情景导入：周一早上九点，工作室群里炸开了锅。


      阿美：“上不了网了！”陈姐：“我这边也是，网页打不开。”小周：“我的微信还能发消息……'
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 5
    content: 12.1 网络管理做什么：网络管理的五大功能、SNMP、日志与远程管理
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授与演示
    minutes: 5
    content: 12.2 故障排查方法（考点）：排查的基本思路、命令组合、常见故障案例库
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“故障排查闯关”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 12.3 网络优化（了解）
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 12.4 新技术一览（了解）
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 12.5 小型网络规划设计流程
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 讲授
    minutes: 5
    content: 12.6 本章常见问题对照
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 拓展
    minutes: 5
    content: 12.7 AI 与网络：智能运维 AIOps
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 【待填】
  - name: 实验
    minutes: 5
    content: 实验 12-1 故障排查闯关
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 按由下往上的顺序使用排查命令，定位常见故障；在 Packet Tracer 中排查同伴设置的故障，写出规范的故障记录
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：一台 Windows 电脑上不了网，请按顺序写出六步排查法，并说明每一步不正常时说明了什么问题。
- '简答题：分店电脑能 ping 通分店路由器（192.168.9.1），ping 总部服务器 192.168.8.130 时，显示“来自 192.168.9.1 的回复: 无法访问目标网络”。请分析原因，写出在分店路由器 R2 上的检查命令和一种解决方法（R1 与 R2 互联地址：R1 10.0.12.1，R2 10.0.12.2）。'
- 简答题：简述小型网络规划设计的七个步骤，并以小禾设计工作室为例，说明“地址规划”这一步要确定哪些内容。
- 实操题：补全下面在路由器 R1 上开启 SSH、禁止 Telnet 的配置：
- 实验报告：实验 12-1、实验 12-2、实验 12-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
