# 第 8 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 8
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 解释 ARP 的工作过程，查看本机的 ARP 缓存，说出 ARP 欺骗的危害
  - 说出 ICMP 的作用和常见报文类型，解释 ping 和 tracert 的原理
  - 说出 DHCP 分配地址的四个步骤，在抓包中找出这四个报文
  - 解释 NAT 和端口地址转换的原理，分析 NAT 转换表
  skill:
  - 在 Packet Tracer 中配置路由器的 DHCP 和 NAT，让各部门自动获取地址并共享公网地址上网
  quality:
  - 认识 ARP 欺骗等风险，增强网络安全防范意识
  - 理解私有地址与 IPv6，了解我国推进 IPv6 的意义
key_points:
- ARP 的工作过程
- ICMP 报文与 ping、tracert 的原理
- DHCP 的四个步骤
- NAT 与 PAT 转换表
difficulties:
- point: DHCP 四个步骤中哪些是广播、为什么第三步还要广播
  solution: 用 DHCP 动画逐步演示，结合 dhcp_arp.pcap 的四个报文看源、目的地址
- point: PAT 如何用端口区分不同主机
  solution: 用 NAT 转换表动画演示两台电脑同用 51001 端口时的转换，配合公司总机比喻
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 35
    content: 8.1 ARP：由 IP 地址问出 MAC 地址：为什么需要 ARP、ARP 的工作过程、ARP 缓存与 ARP 欺骗
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 理解 ARP 的作用和 ARP 欺骗的危害
  - name: 自主学习
    minutes: 35
    content: 8.2 ICMP：网络里的“回执与报错”：ICMP 是做什么的、ping 的原理、tracert 的原理
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 理解 ping、tracert 背后的 ICMP 报文
  - name: 自主学习
    minutes: 30
    content: 8.3 DHCP：自动分配地址：为什么需要 DHCP、DHCP 的四个步骤（考点）、租期与续租、跨网段的 DHCP
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 掌握 DHCP 的四个步骤，会配置 DHCP
  - name: 自主学习
    minutes: 30
    content: 8.4 NAT：私有地址怎样上互联网：为什么需要 NAT、端口地址转换 PAT（考点）、NAT 的好处与麻烦
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 理解 NAT 和 PAT，会读转换表
  - name: 自主学习
    minutes: 30
    content: 8.5 家用路由器其实做了很多事
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 把前几章知识串起来认识家用路由器
  - name: 自主学习
    minutes: 10
    content: 8.6 本章常见问题对照
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 把概念和常见故障对应起来
  - name: 自主学习
    minutes: 10
    content: 8.7 AI 与网络：为什么手机上网拿不到公网地址
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 联系移动网络和 IPv6
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：周一早上，设计部来了一位新同事小周。他把自己的笔记本插上网线，几秒钟后就打开了网页。小林有点奇怪：“我还没给他分配地址呢……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 10
    content: 8.3 DHCP：自动分配地址：为什么需要 DHCP、DHCP 的四个步骤（考点）、租期与续租、跨网段的 DHCP
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 掌握 DHCP 的四个步骤，会配置 DHCP
  - name: 重点讲解
    minutes: 10
    content: 8.4 NAT：私有地址怎样上互联网：为什么需要 NAT、端口地址转换 PAT（考点）、NAT 的好处与麻烦
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 理解 NAT 和 PAT，会读转换表
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 8-1 看 ARP 和 DHCP 的包
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中，为课后提交实验报告做准备
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：新电脑接入工作室网络后，从“没有地址”到能 ping 通网关，会依次发生哪些协议交互？请结合 `dhcp_arp.pcap` 的 12 帧说明。
- 简答题：某 NAT 路由器的公网地址为 198.51.100.2，转换表中有一项：内部 192.168.8.12:51001 ↔ 公网 198.51.100.2:51002，访问 203.0.113.10:80。请说明：① 192.168.8.12 发出的数据报经过路由器后，源地址和源端口变成什么？② 服务器的回复到达路由器时，目的地址和端口是什么？路由器怎样处理？
- 简答题：什么是 ARP 欺骗？它会造成什么危害？说出两种防范办法。
- 实操题：补全下面的思科路由器配置，使 R1 为 192.168.8.0/26 网段分配地址（排除 192.168.8.1～192.168.8.10，网关 192.168.8.1），并让该网段通过 Gi0/1 的地址以 PAT 方式上网。
- 实验报告：实验 8-1、实验 8-2、实验 8-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
