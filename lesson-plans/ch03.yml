# 第 3 章教案，由 make_lesson_plan.py draft 生成后人工修改。线上：课前按节自主学习（线上理论学时）+ 课后线上实验（实验学时）；线下面授讲重点难点、讲评实验。
chapter: 3
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出物理层的任务、单工 / 半双工 / 全双工的区别，以及常见传输介质的特点
  - 识别不归零编码、曼彻斯特编码和差分曼彻斯特编码的波形
  - 解释带宽、噪声与信道容量的关系，以及复用技术为什么能让一条线同时传多路信号
  skill:
  - 按 T568B 标准排出网线线序，区分单模光纤和多模光纤
  - 查看本机的 WiFi 信号强度、信道和速率，分析测速达不到套餐速率的原因
  quality:
  - 布线施工讲究规范：线序、长度、标签，培养严谨细致的工作作风
  - 了解我国光通信和光模块产业的发展，增强科技自信
key_points:
- 单工、半双工与全双工
- 曼彻斯特编码与三种调制
- 比特率与波特率、香农公式
- 双绞线、光纤的选择与 T568B 线序
- 四种复用方式
difficulties:
- point: 香农公式和比特率计算对数学基础薄弱的学生较难
  solution: 只用 log₂ 的几个整数值（2、4、8、16），通过电话线例题理解“带宽和信噪比决定上限”
- point: 曼彻斯特与差分曼彻斯特编码容易画错
  solution: 用编码动画逐码元演示，强调“中间看跳变方向”与“开始看有无跳变”，课堂上让学生画一串比特
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 30
    content: 3.1 物理层要解决什么问题：物理层的任务、数据通信的几个基本概念、单工、半双工与全双工
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 知道物理层的四个特性，建立“透明传比特”的概念
  - name: 自主学习
    minutes: 30
    content: 3.2 编码与调制：让 0 和 1 变成信号：三种常见编码、三种基本调制、码元与比特
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 通过动画理解编码与调制
  - name: 自主学习
    minutes: 30
    content: 3.3 信道能传多快：为什么速率不能无限提高、香农公式、回到“千兆宽带”
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 理解速率上限的来源，会用香农公式估算
  - name: 自主学习
    minutes: 30
    content: 3.4 传输介质：双绞线、同轴电缆、光纤、无线传输
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会选线、会排线序，能区分单模和多模光纤
  - name: 自主学习
    minutes: 25
    content: 3.5 复用：一条线同时走很多路信号：四种复用方式
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件、操作交互动画，完成节后小测
    intent: 理解一条线怎样同时走多路信号
  - name: 自主学习
    minutes: 25
    content: 3.6 宽带接入：家里和单位怎样连上互联网：光纤到户与 PON、光猫指示灯怎么看
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 会看光猫指示灯，了解光纤到户
  - name: 自主学习
    minutes: 5
    content: 3.7 本章常见问题对照
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 把概念和布线、WiFi 问题对应起来
  - name: 自主学习
    minutes: 5
    content: 3.8 AI 与网络：光模块和 AI 数据中心
    teacher: 在学习平台发布本节学习任务和思考题，在线答疑
    student: 阅读网页教材、观看课件，完成节后小测
    intent: 了解光模块与 AI 数据中心
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：工作室要搬到同一栋楼的大一点的办公室，禾姐让小林负责重新布线。物业给了一张清单让他选：“六类线还是超六类线？”“光纤要单……
    teacher: 回顾情景，请学生说出线上学习中遇到的疑问
    student: 结合情景提出问题，分享线上学习收获
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 重点讲解
    minutes: 8
    content: 3.2 编码与调制：让 0 和 1 变成信号：三种常见编码、三种基本调制、码元与比特
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 通过动画理解编码与调制
  - name: 重点讲解
    minutes: 6
    content: 3.3 信道能传多快：为什么速率不能无限提高、香农公式、回到“千兆宽带”
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 理解速率上限的来源，会用香农公式估算
  - name: 重点讲解
    minutes: 6
    content: 3.4 传输介质：双绞线、同轴电缆、光纤、无线传输
    teacher: 精讲本节重点和难点，结合交互动画和例题演示，针对线上小测中的错误答疑
    student: 跟着推导、操作动画、回答提问，订正线上小测中的错误
    intent: 会选线、会排线序，能区分单模和多模光纤
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 实验讲评与答疑
    minutes: 5
    content: 讲评上一章实验报告中的共性问题，说明本章实验的关键步骤和注意事项
    teacher: 展示典型实验结果和常见错误，布置本章实验
    student: 对照讲评检查自己的实验，记录本章实验要点
    intent: 衔接线上实验，减少实验中的卡顿
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 线上实验
    minutes: 45
    content: 实验 3-1 认识网线和接口，排出 T568B 线序
    teacher: 在学习平台发布实验指导，在线答疑，批改实验报告
    student: 按教材步骤完成实验，填写记录表，提交实验报告
    intent: 动手完成实验关键步骤，把本章知识用到实际操作中，为课后提交实验报告做准备
  - name: 课后巩固（课外）
    minutes: 60
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：画出比特串 1 0 1 1 0 的曼彻斯特编码波形（按“中间向上跳为 1、向下跳为 0”），并说明曼彻斯特编码的优缺点。
- 简答题：比较单模光纤和多模光纤，说出它们在纤芯、光源、传输距离和应用场合上的区别。
- 简答题：工作室新办公室最远的工位离机柜 130 米，小林打算直接拉一根六类网线过去。你认为可以吗？请给出理由和建议。
- 实操题：运行 `netsh wlan show interfaces`，记录频带、信道、信号和接收速率；然后到离路由器最远的位置再测一次，用本章知识解释两次结果的差异。
- 实验报告：实验 3-1、实验 3-2、实验 3-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
